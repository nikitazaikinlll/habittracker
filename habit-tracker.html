<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер привычек — Панель эффективности</title>
<!-- PWA: возможность установить как приложение на телефон -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1D36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habit Ops">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F3F4F7;
  --surface:#FFFFFF;
  --sidebar:#0F1D36;
  --sidebar-soft:#1B2C4F;
  --sidebar-text:#B9C4DD;
  --sidebar-text-active:#FFFFFF;
  --accent:#1E7F72;
  --accent-soft:#E4F1EE;
  --accent-2:#B8912F;
  --accent-2-soft:#F6EFDD;
  --text:#1B2230;
  --muted:#6B7280;
  --border:#E2E5EC;
  --danger:#C1443A;
  --danger-soft:#FBEAE8;
  --radius:10px;
  --shadow:0 1px 2px rgba(15,29,54,.06),0 4px 16px rgba(15,29,54,.05);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14px;
  display:flex;
  min-height:100vh;
}
h1,h2,h3,h4{
  font-family:'IBM Plex Serif',serif;
  font-weight:600;
  margin:0 0 4px 0;
  letter-spacing:-.01em;
}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}
input,select,textarea{font-family:inherit;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:236px;
  background:var(--sidebar);
  color:var(--sidebar-text);
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  padding:22px 14px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 8px 22px 8px;
  border-bottom:1px solid rgba(255,255,255,.08);
  margin-bottom:18px;
}
.brand-mark{
  width:32px;height:32px;border-radius:7px;
  background:linear-gradient(155deg,var(--accent) 0%, #14524a 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Serif',serif;font-weight:700;color:#fff;font-size:15px;
  flex-shrink:0;
}
.brand-title{font-family:'IBM Plex Serif',serif;font-weight:600;font-size:15px;color:#fff;line-height:1.15;}
.brand-sub{font-size:10.5px;color:var(--sidebar-text);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}

.nav-group-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#6E7FA3;
  padding:14px 10px 6px 10px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:7px;margin:1px 0;
  font-size:13.5px;font-weight:500;color:var(--sidebar-text);
  transition:background .12s;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item .num{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6E7FA3;width:16px;flex-shrink:0;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--sidebar-soft);color:#fff;}
.nav-item.active .num{color:var(--accent-2);}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);}
.io-btn{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:8px 10px;border-radius:7px;background:rgba(255,255,255,.05);
  color:var(--sidebar-text);border:1px solid rgba(255,255,255,.09);font-size:12.5px;margin-bottom:6px;
}
.io-btn:hover{background:rgba(255,255,255,.1);color:#fff;}
.save-state{font-size:11px;color:#6E7FA3;padding:4px 10px 0 10px;}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  padding:20px 34px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
.topbar .eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px;}
.topbar h1{font-size:22px;}
.topbar .desc{color:var(--muted);font-size:13px;margin-top:3px;}
.content{padding:28px 34px 60px 34px;max-width:1180px;}

/* ---------- Cards / layout helpers ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);
}
.grid{display:grid;gap:16px;}
.cols-2{grid-template-columns:1fr 1fr;}
.cols-3{grid-template-columns:repeat(3,1fr);}
.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr;}}

.stat{padding:16px 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;}
.stat .value{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;}
.stat .sub{font-size:11.5px;color:var(--muted);margin-top:4px;}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px 0;}
.section-title h2{font-size:16px;}
.section-title .hint{font-size:12px;color:var(--muted);}
.section-title:first-child{margin-top:0;}

/* ---------- Buttons ---------- */
.btn{
  padding:8px 14px;border-radius:7px;border:1px solid var(--border);background:var(--surface);
  font-size:13px;font-weight:500;color:var(--text);display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:#C7CCD9;background:#FAFBFC;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:#186b60;border-color:#186b60;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--bg);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-danger{color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger-soft);}

/* ---------- Category / habit blocks ---------- */
.cat-block{margin-bottom:22px;}
.cat-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.cat-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.cat-head h3{font-size:14px;color:var(--text);}
.cat-count{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}

.habit-row{
  display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--border);
  border-radius:9px;background:var(--surface);margin-bottom:8px;
}
.habit-info{flex:1;min-width:0;}
.habit-name{font-weight:600;font-size:13.5px;}
.habit-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4;max-width:520px;}
.habit-meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
.tag{
  font-size:10.5px;padding:2px 7px;border-radius:20px;background:var(--bg);color:var(--muted);
  border:1px solid var(--border);font-weight:500;
}
.habit-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}

.seg-toggle{
  width:38px;height:38px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);flex-shrink:0;
  transition:all .12s;position:relative;
}
.seg-toggle.done{background:var(--accent);border-color:var(--accent);color:#fff;}
.seg-toggle .seg-label{position:absolute;bottom:-15px;font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}

.pct-wrap{display:flex;align-items:center;gap:8px;min-width:180px;}
.pct-bar{flex:1;height:8px;border-radius:5px;background:var(--bg);overflow:hidden;border:1px solid var(--border);}
.pct-bar-fill{height:100%;background:var(--accent);border-radius:5px;transition:width .15s;}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:7px;background:var(--surface);overflow:hidden;}
.stepper input{border:none;outline:none;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:4px 2px;width:56px;background:transparent;}
.stepper-btn{background:none;border:none;padding:5px 7px;font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;line-height:1;transition:background .1s;}
.stepper-btn:hover{background:var(--bg);color:var(--text);}

.banner{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 16px;border-radius:9px;background:var(--accent-2-soft);border:1px solid #E7D6A0;margin-bottom:16px;
}
.banner strong{font-size:13px;}
.banner p{margin:2px 0 0 0;font-size:12px;color:#6B5A1E;}

.empty{padding:36px 20px;text-align:center;color:var(--muted);}
.empty h3{color:var(--text);font-size:15px;margin-bottom:6px;}
.empty p{font-size:12.5px;margin:0 0 14px 0;}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  padding:8px 10px;border-bottom:1.5px solid var(--border);font-weight:600;
}
td{padding:9px 10px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
.week-cell{text-align:center;width:54px;}
.day-check{
  width:36px;height:36px;border-radius:7px;border:1.5px solid var(--border);
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;
  color:var(--muted);background:var(--surface);font-family:'IBM Plex Mono',monospace;
  position:relative;overflow:hidden;user-select:none;
}
.day-check.done{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.day-check.future{opacity:.35;}

.partial-check-wrapper{position:relative;display:inline-block;line-height:1;font-size:15px;font-weight:bold;}
.check-bg{color:var(--border);}
.check-fg{position:absolute;top:0;left:0;bottom:0;color:var(--accent);overflow:hidden;white-space:nowrap;}

/* ---------- Tabs / week-month switch ---------- */
.pill-switch{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px;}
.pill-switch button{padding:6px 13px;border-radius:6px;border:none;background:none;font-size:12.5px;font-weight:500;color:var(--muted);}
.pill-switch button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,20,33,.42);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:15px;}
.modal-body{padding:20px 22px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.close-x{background:none;border:none;font-size:18px;color:var(--muted);line-height:1;padding:4px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--text);}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:var(--surface);
}
.field textarea{resize:vertical;min-height:56px;}
.radio-row,.check-row{display:flex;gap:8px;flex-wrap:wrap;}
.radio-opt{
  padding:7px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:12.5px;color:var(--muted);
  display:flex;align-items:center;gap:6px;cursor:pointer;
}
.radio-opt.sel{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600;}
.chip{
  padding:6px 11px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;color:var(--muted);cursor:pointer;
}
.chip.sel{border-color:var(--accent);background:var(--accent);color:#fff;}
.chip.disabled{opacity:.35;cursor:not-allowed;background:var(--bg);}
.chip.missed{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);font-weight:600;}

/* ---------- Gantt ---------- */
.gantt-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
.gantt{min-width:760px;}
.gantt-row{display:grid;grid-template-columns:190px 1fr;border-bottom:1px solid var(--border);}
.gantt-row:last-child{border-bottom:none;}
.gantt-label{padding:12px 14px;font-size:12.5px;font-weight:600;border-right:1px solid var(--border);display:flex;align-items:center;background:var(--bg);}
.gantt-track{position:relative;padding:10px 0;min-height:48px;}
.gantt-bar{
  position:absolute;height:22px;border-radius:5px;top:12px;display:flex;align-items:center;padding:0 9px;
  font-size:10.5px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.gantt-axis{display:grid;grid-template-columns:190px 1fr;border-bottom:1.5px solid var(--border);}
.gantt-axis-track{display:flex;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.gantt-axis-track div{flex:1;padding:8px 6px;border-left:1px dashed var(--border);}

.plan-card{border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px;background:var(--surface);}
.plan-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.phase-item{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--border);align-items:flex-start;}
.phase-item:first-child{border-top:none;}
.phase-idx{width:22px;height:22px;border-radius:50%;background:var(--accent-2-soft);color:#8A6D1E;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'IBM Plex Mono',monospace;}
.phase-body{flex:1;}
.phase-body .pname{font-weight:600;font-size:12.5px;}
.phase-body .pdate{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:1px;}
.phase-body .pnote{font-size:12px;color:var(--text);margin-top:3px;}

.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.chart-box h4{font-size:13px;margin-bottom:12px;}
canvas{max-width:100%;}

::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:#D3D8E2;border-radius:6px;}

.toast{
  position:fixed;bottom:22px;right:22px;background:var(--sidebar);color:#fff;padding:11px 18px;border-radius:9px;
  font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:80;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0);}

/* ---------- Мобильная верхняя панель и выезжающее меню ---------- */
.mobile-topbar{
  display:none;
  align-items:center;gap:12px;
  position:fixed;top:0;left:0;right:0;height:52px;
  background:var(--sidebar);color:#fff;z-index:96;
  padding:0 14px;box-shadow:0 1px 2px rgba(0,0,0,.15);
}
.mobile-topbar .hamburger{background:none;border:none;color:#fff;font-size:21px;padding:6px;line-height:1;}
.mobile-topbar .mt-title{font-family:'IBM Plex Serif',serif;font-weight:600;font-size:14px;}
.sidebar-close{display:none;margin-left:auto;background:none;border:none;color:var(--sidebar-text);font-size:17px;padding:4px;flex-shrink:0;}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,20,33,.45);z-index:90;}
.sidebar-backdrop.show{display:block;}

@media (max-width: 860px){
  body{flex-direction:column;}
  .mobile-topbar{display:flex;}
  .sidebar{
    position:fixed;top:0;left:0;height:100vh;z-index:95;width:250px;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 30px rgba(0,0,0,.3);
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-close{display:inline-block;}
  .main{width:100%;padding-top:52px;}
  .topbar{padding:16px 16px 8px 16px;flex-wrap:wrap;row-gap:8px;}
  .topbar h1{font-size:19px;}
  .content{padding:14px 14px 40px 14px;}
  .card{overflow-x:auto;}
  .cols-2,.cols-3,.cols-4{grid-template-columns:1fr;}
  .habit-row{flex-wrap:wrap;}
  .habit-controls{width:100%;margin-top:10px;justify-content:flex-start;}
  .pct-wrap{min-width:0;width:100%;}
  .modal{max-width:94vw;}
  .modal-body{padding:16px;}
  .gantt-row{grid-template-columns:140px 1fr;}
}
</style>
</head>
<body>

<div class="mobile-topbar">
  <button class="hamburger" id="btnHamburger" aria-label="Меню">☰</button>
  <span class="mt-title">Habit Ops</span>
</div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">Э</div>
    <div>
      <div class="brand-title">Панель эффективности</div>
      <div class="brand-sub">Habit Ops</div>
    </div>
    <button class="sidebar-close" id="btnSidebarClose" aria-label="Закрыть меню">✕</button>
  </div>

  <div class="nav-group-label">Учёт</div>
  <button class="nav-item" data-view="today"><span class="num">01</span>Сегодня</button>
  <button class="nav-item" data-view="week"><span class="num">02</span>Неделя</button>
  <button class="nav-item" data-view="month"><span class="num">03</span>Месяц</button>
  <button class="nav-item" data-view="alltime"><span class="num">04</span>Итоги за период</button>

  <div class="nav-group-label">Управление</div>
  <button class="nav-item" data-view="habits"><span class="num">05</span>Привычки и категории</button>
  <button class="nav-item" data-view="strategy"><span class="num">06</span>Стратегический план</button>

  <div class="sidebar-foot">
    <button class="io-btn" id="btnExport">⤓ Сохранить копию (.json)</button>
    <button class="io-btn" id="btnImport">⤒ Загрузить копию (.json)</button>
    <input type="file" id="fileImport" accept="application/json" style="display:none;">
    <button class="io-btn" id="btnClear" style="color:#E8A6A0;">🗑 Очистить данные</button>
    <button class="io-btn" id="btnSync">☁ Синхронизация</button>
    <div class="save-state" id="saveState">Автосохранение включено</div>
    <div class="save-state" id="syncState" style="opacity:.75;"></div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <div class="eyebrow" id="topEyebrow">Ежедневный учёт</div>
      <h1 id="topTitle">Сегодня</h1>
      <div class="desc" id="topDesc">Отмечайте выполнение привычек по категориям</div>
    </div>
    <div id="topActions"></div>
  </div>
  <div class="content" id="content"></div>
</main>

<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ДАННЫЕ / STATE
   ========================================================= */
const DOW = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DOW_FULL = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const CAT_COLORS = ['#1E7F72','#B8912F','#5B6EE1','#C1443A','#8A56AC','#2F8FBF','#C2703D'];

function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }[cite: 1]
function pad(n){ return n<10 ? '0'+n : ''+n; }[cite: 1]
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }[cite: 1]

function isHabitScheduledOn(habit, dateObj){
  const iso = toISO(dateObj);[cite: 1]
  if(habit.cadence==='daily') return true;[cite: 1]
  if(habit.cadence==='weekly'){
    const wk = weekKeyOf(dateObj);[cite: 1]
    const a = getWeeklyAssignment(habit, wk);[cite: 1]
    return a ? a.includes(iso) : false;[cite: 1]
  }
  if(habit.cadence==='monthly'){
    const mk = monthKeyOf(dateObj);[cite: 1]
    const a = getMonthlyAssignment(habit, mk);[cite: 1]
    return a ? a.includes(iso) : false;[cite: 1]
  }
  return false;[cite: 1]
}

function habitsNeedingAssignment(refDate){

  return state.habits.filter(h=>h.active && ([cite: 1]
    (h.cadence==='weekly' && !getWeeklyAssignment(h,wk)) ||[cite: 1]
    (h.cadence==='monthly' && !getMonthlyAssignment(h,mk))[cite: 1]

function habitDayValue(habit, date, capped=false){
  if(habit.trackingType==='percentage'){
    if(habit.segments && habit.segments.length){
      let any=false, actualTotal=0;
      habit.segments.forEach(s=>{ const v=getEntry(habit.id,date,s); if(v!==null){ any=true; actualTotal+=v; } });[cite: 1]
      if(!any) return null;[cite: 1]
      const pct = Math.round((actualTotal/habit.target)*100);
      return capped ? Math.max(0, Math.min(100, pct)) : Math.max(0, pct);
    }
    const v = getEntry(habit.id,date,null);[cite: 1]
    if(v===null) return null;[cite: 1]
    const pct = Math.round((v/habit.target)*100);
    return capped ? Math.max(0, Math.min(100, pct)) : Math.max(0, pct);
  }
  const segs = (habit.segments&&habit.segments.length) ? habit.segments : [null];[cite: 1]
  let done=0, total=segs.length, any=false;[cite: 1]
  segs.forEach(s=>{ const v=getEntry(habit.id,date,s); if(v!==null){any=true;} if(v===true) done++; });[cite: 1]
  if(!any) return null;[cite: 1]
  const pct = Math.round((done/total)*100);[cite: 1]
  return capped ? Math.min(100, pct) : pct;
}

function isDatePastOrFilled(iso){
  const today = todayISO();
  if(iso < today) return true;
  if(iso === today){
    return Object.keys(state.entries).some(k => k.includes('|'+iso+'|') && state.entries[k] !== null && state.entries[k] !== false && state.entries[k] !== 0);
  }
  return false;
}

function habitWeekCompletion(h, weekStart, capped=true){
  let sum=0, counted=false;
  for(let i=0;i<7;i++){
    const d = addDays(weekStart,i);[cite: 1]
    const iso = toISO(d);[cite: 1]
    if(!isDatePastOrFilled(iso)) continue;
    if(!isHabitScheduledOn(h,d)) continue;[cite: 1]
    counted = true;[cite: 1]
    const v = habitDayValue(h, iso, capped);
    sum += (v===null?0:v);[cite: 1]
  }
  if(!counted) return null;[cite: 1]
  const res = Math.round(sum / h.freq);
  return capped ? Math.min(100, res) : res;
}

function habitMonthCompletion(h, monthStartDate, capped=true){
  const y=monthStartDate.getFullYear(), m=monthStartDate.getMonth();[cite: 1]
  const nd = daysInMonth(y,m);[cite: 1]
  let sum=0, counted=false;[cite: 1]
  for(let dnum=1; dnum<=nd; dnum++){
    const d = new Date(y,m,dnum);[cite: 1]
    const iso = toISO(d);
    if(!isDatePastOrFilled(iso)) continue;
    if(!isHabitScheduledOn(h,d)) continue;[cite: 1]
    counted = true;[cite: 1]
    const v = habitDayValue(h, iso, capped);
    sum += (v===null?0:v);[cite: 1]
  }
  if(!counted) return null;[cite: 1]
  const res = Math.round(sum / h.freq);

function weeksOverlappingMonth(y,m){
  const first = new Date(y,m,1), last = new Date(y,m,daysInMonth(y,m));[cite: 1]
  let ws = startOfWeek(first);[cite: 1]
  const weeks = [];[cite: 1]
  while(ws<=last){ weeks.push(new Date(ws)); ws = addDays(ws,7); }[cite: 1]
  return weeks;[cite: 1]
}

function habitWeeklyHabitMonthAvg(h, y, m, capped=true){

  if(!vals.length) return null;[cite: 1]
  const res = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);[cite: 1]
  return capped ? Math.min(100, res) : res;
}

function habitMonthlyAllTimeAvg(h, startDate, endDate, capped=true){

function habitDailyRangeAvg(h, rangeStart, rangeEndInclusive, capped=true){

  let d = new Date(rangeStart);[cite: 1]
  while(d<=rangeEndInclusive){

function habitScoreForWeek(h, weekStart, capped=true){

  return habitDailyRangeAvg(h, weekStart, addDays(weekStart,6), capped);[cite: 1]

function habitScoreForMonth(h, y, m, capped=true){
  const monthStart = new Date(y,m,1), monthEnd = new Date(y,m,daysInMonth(y,m));[cite: 1]
  if(h.cadence==='monthly') return habitMonthCompletion(h, monthStart, capped);[cite: 1]

function habitScoreAllTime(h, startDate, endDate, capped=true){

function getSyncConfig(){
  try{
    const raw = localStorage.getItem('habitops_sync_cfg');[cite: 1]
    return raw ? JSON.parse(raw) : null;[cite: 1]
  }catch(e){ return null; }[cite: 1]
}
function setSyncConfig(cfg){

function setSyncStatus(text){

function genSyncId(){
  const bytes = new Uint8Array(16);[cite: 1]
  crypto.getRandomValues(bytes);[cite: 1]
  return Array.from(bytes, b=>b.toString(16).padStart(2,'0')).join('');[cite: 1]
}

let cloudPushTimer = null;[cite: 1]
function scheduleCloudPush(){
  const cfg = getSyncConfig();[cite: 1]
  if(!cfg) return;[cite: 1]
  clearTimeout(cloudPushTimer);[cite: 1]
  cloudPushTimer = setTimeout(pushToCloud, 1200);[cite: 1]

async function pushToCloud(){
  const cfg = getSyncConfig();[cite: 1]
  if(!cfg) return;[cite: 1]
  setSyncStatus('Синхронизация…');[cite: 1]
  try{
    const res = await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/habit_sync?on_conflict=sync_id', {
      method:'POST',
      headers:{
        'apikey': cfg.key,
        'Authorization': 'Bearer '+cfg.key,
        'Content-Type':'application/json',
        'Prefer':'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify([{sync_id:cfg.syncId, state:state, updated_at:new Date(state.updatedAt||Date.now()).toISOString()}])
    });[cite: 1]
    setSyncStatus(res.ok ? 'В облаке · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) : 'Ошибка синхронизации ('+res.status+')');[cite: 1]
  }catch(e){
    setSyncStatus('Нет сети — сохранено локально');[cite: 1]
  }
}

async function pullFromCloud(cfg){
  try{
    const res = await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/habit_sync?sync_id=eq.'+encodeURIComponent(cfg.syncId)+'&select=state,updated_at', {
      headers:{ 'apikey':cfg.key, 'Authorization':'Bearer '+cfg.key }
    });[cite: 1]
    if(!res.ok) return null;[cite: 1]
    const rows = await res.json();[cite: 1]
    return rows && rows[0] ? rows[0] : null;[cite: 1]
  }catch(e){ return null; }[cite: 1]
}

async function initSync(){
  const cfg = getSyncConfig();[cite: 1]
  if(!cfg){ setSyncStatus('Синхронизация не настроена'); return; }[cite: 1]
  setSyncStatus('Проверяем облако…');[cite: 1]
  const remote = await pullFromCloud(cfg);[cite: 1]
  const remoteTs = remote ? new Date(remote.updated_at).getTime() : 0;[cite: 1]
  const localTs = state.updatedAt || 0;[cite: 1]
  if(remote && remoteTs > localTs){
    state = remote.state;[cite: 1]
    state.habits.forEach(h=>{ if(h.step===undefined) h.step = h.trackingType==='percentage'? (h.target>=1000?100:1) : 1; });
    state.updatedAt = remoteTs;[cite: 1]
    try{ localStorage.setItem('habitops_state_v1', JSON.stringify(state)); }catch(e){}[cite: 1]
    toast('Загружены более свежие данные из облака');[cite: 1]
    render();[cite: 1]
    setSyncStatus('Синхронизировано · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));[cite: 1]
  } else {
    if(!state.updatedAt) state.updatedAt = Date.now();[cite: 1]
    try{ localStorage.setItem('habitops_state_v1', JSON.stringify(state)); }catch(e){}[cite: 1]
    pushToCloud();[cite: 1]
  }
}

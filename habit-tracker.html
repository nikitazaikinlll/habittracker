<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер привычек — Панель эффективности</title>
<!-- PWA: возможность установить как приложение на телефон -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1D36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habit Ops">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F3F4F7;
  --surface:#FFFFFF;
  --sidebar:#0F1D36;
  --sidebar-soft:#1B2C4F;
  --sidebar-text:#B9C4DD;
  --sidebar-text-active:#FFFFFF;
  --accent:#1E7F72;
  --accent-soft:#E4F1EE;
  --accent-2:#B8912F;
  --accent-2-soft:#F6EFDD;
  --text:#1B2230;
  --muted:#6B7280;
  --border:#E2E5EC;
  --danger:#C1443A;
  --danger-soft:#FBEAE8;
  --radius:10px;
  --shadow:0 1px 2px rgba(15,29,54,.06),0 4px 16px rgba(15,29,54,.05);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14px;
  display:flex;
  min-height:100vh;
}
h1,h2,h3,h4{
  font-family:'IBM Plex Serif',serif;
  font-weight:600;
  margin:0 0 4px 0;
  letter-spacing:-.01em;
}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}
input,select,textarea{font-family:inherit;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:236px;
  background:var(--sidebar);
  color:var(--sidebar-text);
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  padding:22px 14px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 8px 22px 8px;
  border-bottom:1px solid rgba(255,255,255,.08);
  margin-bottom:18px;
}
.brand-mark{
  width:32px;height:32px;border-radius:7px;
  background:linear-gradient(155deg,var(--accent) 0%, #14524a 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Serif',serif;font-weight:700;color:#fff;font-size:15px;
  flex-shrink:0;
}
.brand-title{font-family:'IBM Plex Serif',serif;font-weight:600;font-size:15px;color:#fff;line-height:1.15;}
.brand-sub{font-size:10.5px;color:var(--sidebar-text);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}

.nav-group-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#6E7FA3;
  padding:14px 10px 6px 10px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:7px;margin:1px 0;
  font-size:13.5px;font-weight:500;color:var(--sidebar-text);
  transition:background .12s;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item .num{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6E7FA3;width:16px;flex-shrink:0;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--sidebar-soft);color:#fff;}
.nav-item.active .num{color:var(--accent-2);}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);}
.io-btn{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:8px 10px;border-radius:7px;background:rgba(255,255,255,.05);
  color:var(--sidebar-text);border:1px solid rgba(255,255,255,.09);font-size:12.5px;margin-bottom:6px;
}
.io-btn:hover{background:rgba(255,255,255,.1);color:#fff;}
.save-state{font-size:11px;color:#6E7FA3;padding:4px 10px 0 10px;}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  padding:20px 34px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
.topbar .eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px;}
.topbar h1{font-size:22px;}
.topbar .desc{color:var(--muted);font-size:13px;margin-top:3px;}
.content{padding:28px 34px 60px 34px;max-width:1180px;}

/* ---------- Cards / layout helpers ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);
}
.grid{display:grid;gap:16px;}
.cols-2{grid-template-columns:1fr 1fr;}
.cols-3{grid-template-columns:repeat(3,1fr);}
.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr;}}

.stat{padding:16px 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;}
.stat .value{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;}
.stat .sub{font-size:11.5px;color:var(--muted);margin-top:4px;}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px 0;}
.section-title h2{font-size:16px;}
.section-title .hint{font-size:12px;color:var(--muted);}
.section-title:first-child{margin-top:0;}

/* ---------- Buttons ---------- */
.btn{
  padding:8px 14px;border-radius:7px;border:1px solid var(--border);background:var(--surface);
  font-size:13px;font-weight:500;color:var(--text);display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:#C7CCD9;background:#FAFBFC;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:#186b60;border-color:#186b60;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--bg);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-danger{color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger-soft);}

/* ---------- Category / habit blocks ---------- */
.cat-block{margin-bottom:22px;}
.cat-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.cat-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.cat-head h3{font-size:14px;color:var(--text);}
.cat-count{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}

.habit-row{
  display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--border);
  border-radius:9px;background:var(--surface);margin-bottom:8px;
}
.habit-info{flex:1;min-width:0;}
.habit-name{font-weight:600;font-size:13.5px;}
.habit-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4;max-width:520px;}
.habit-meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
.tag{
  font-size:10.5px;padding:2px 7px;border-radius:20px;background:var(--bg);color:var(--muted);
  border:1px solid var(--border);font-weight:500;
}
.habit-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}

.seg-toggle{
  width:38px;height:38px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);flex-shrink:0;
  transition:all .12s;position:relative;
}
.seg-toggle.done{background:var(--accent);border-color:var(--accent);color:#fff;}
.seg-toggle .seg-label{position:absolute;bottom:-15px;font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}

.pct-wrap{display:flex;align-items:center;gap:8px;min-width:180px;}
.pct-input-row{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.pct-step{
  width:24px;height:24px;flex-shrink:0;border:1px solid var(--border);border-radius:6px;background:var(--surface);
  color:var(--text);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
}
.pct-step:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.pct-step:active{transform:scale(0.94);}
.pct-step.sm{width:19px;height:19px;font-size:11px;border-radius:5px;}
.pct-bar{flex:1;height:8px;border-radius:5px;background:var(--bg);overflow:hidden;border:1px solid var(--border);}
.pct-bar-fill{height:100%;background:var(--accent);border-radius:5px;transition:width .15s;}
.pct-input{width:56px;padding:5px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;text-align:right;font-family:'IBM Plex Mono',monospace;}

.banner{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 16px;border-radius:9px;background:var(--accent-2-soft);border:1px solid #E7D6A0;margin-bottom:16px;
}
.banner strong{font-size:13px;}
.banner p{margin:2px 0 0 0;font-size:12px;color:#6B5A1E;}

.empty{padding:36px 20px;text-align:center;color:var(--muted);}
.empty h3{color:var(--text);font-size:15px;margin-bottom:6px;}
.empty p{font-size:12.5px;margin:0 0 14px 0;}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  padding:8px 10px;border-bottom:1.5px solid var(--border);font-weight:600;
}
td{padding:9px 10px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
.week-cell{text-align:center;width:56px;}
.day-check{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);background:var(--surface);font-family:'IBM Plex Mono',monospace;overflow:hidden;position:relative;letter-spacing:-.2px;}
.day-check.done{background:var(--accent);border-color:var(--accent);color:#fff;}
.day-check.future{opacity:.35;}
.day-check .pc-glyph{font-size:15px;font-weight:700;color:var(--accent);}

/* ---------- Tabs / week-month switch ---------- */
.pill-switch{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px;}
.pill-switch button{padding:6px 13px;border-radius:6px;border:none;background:none;font-size:12.5px;font-weight:500;color:var(--muted);}
.pill-switch button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,20,33,.42);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:15px;}
.modal-body{padding:20px 22px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.close-x{background:none;border:none;font-size:18px;color:var(--muted);line-height:1;padding:4px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--text);}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:var(--surface);
}
.field textarea{resize:vertical;min-height:56px;}
.radio-row,.check-row{display:flex;gap:8px;flex-wrap:wrap;}
.radio-opt{
  padding:7px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:12.5px;color:var(--muted);
  display:flex;align-items:center;gap:6px;
}
.radio-opt.sel{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600;}
.chip{
  padding:6px 11px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;color:var(--muted);cursor:pointer;
}
.chip.sel{border-color:var(--accent);background:var(--accent);color:#fff;}
.chip.disabled{opacity:.35;cursor:not-allowed;background:var(--bg);}
.chip.missed{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);font-weight:600;}

/* ---------- Gantt ---------- */
.gantt-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
.gantt{min-width:760px;}
.gantt-row{display:grid;grid-template-columns:190px 1fr;border-bottom:1px solid var(--border);}
.gantt-row:last-child{border-bottom:none;}
.gantt-label{padding:12px 14px;font-size:12.5px;font-weight:600;border-right:1px solid var(--border);display:flex;align-items:center;background:var(--bg);}
.gantt-track{position:relative;padding:10px 0;min-height:48px;}
.gantt-bar{
  position:absolute;height:22px;border-radius:5px;top:12px;display:flex;align-items:center;padding:0 9px;
  font-size:10.5px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.gantt-axis{display:grid;grid-template-columns:190px 1fr;border-bottom:1.5px solid var(--border);}
.gantt-axis-track{display:flex;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.gantt-axis-track div{flex:1;padding:8px 6px;border-left:1px dashed var(--border);}

.plan-card{border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px;background:var(--surface);}
.plan-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.phase-item{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--border);align-items:flex-start;}
.phase-item:first-child{border-top:none;}
.phase-idx{width:22px;height:22px;border-radius:50%;background:var(--accent-2-soft);color:#8A6D1E;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'IBM Plex Mono',monospace;}
.phase-body{flex:1;}
.phase-body .pname{font-weight:600;font-size:12.5px;}
.phase-body .pdate{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:1px;}
.phase-body .pnote{font-size:12px;color:var(--text);margin-top:3px;}

.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.chart-box h4{font-size:13px;margin-bottom:12px;}
canvas{max-width:100%;}

::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:#D3D8E2;border-radius:6px;}

.toast{
  position:fixed;bottom:22px;right:22px;background:var(--sidebar);color:#fff;padding:11px 18px;border-radius:9px;
  font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:80;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0);}

/* ---------- Мобильная верхняя панель и выезжающее меню ---------- */
.mobile-topbar{
  display:none;
  align-items:center;gap:12px;
  position:fixed;top:0;left:0;right:0;height:52px;
  background:var(--sidebar);color:#fff;z-index:96;
  padding:0 14px;box-shadow:0 1px 2px rgba(0,0,0,.15);
}
.mobile-topbar .hamburger{background:none;border:none;color:#fff;font-size:21px;padding:6px;line-height:1;}
.mobile-topbar .mt-title{font-family:'IBM Plex Serif',serif;font-weight:600;font-size:14px;}
.sidebar-close{display:none;margin-left:auto;background:none;border:none;color:var(--sidebar-text);font-size:17px;padding:4px;flex-shrink:0;}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,20,33,.45);z-index:90;}
.sidebar-backdrop.show{display:block;}

@media (max-width: 860px){
  body{flex-direction:column;}
  .mobile-topbar{display:flex;}
  .sidebar{
    position:fixed;top:0;left:0;height:100vh;z-index:95;width:250px;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 30px rgba(0,0,0,.3);
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-close{display:inline-block;}
  .main{width:100%;padding-top:52px;}
  .topbar{padding:16px 16px 8px 16px;flex-wrap:wrap;row-gap:8px;}
  .topbar h1{font-size:19px;}
  .content{padding:14px 14px 40px 14px;}
  .card{overflow-x:auto;}
  .cols-2,.cols-3,.cols-4{grid-template-columns:1fr;}
  .habit-row{flex-wrap:wrap;}
  .habit-controls{width:100%;margin-top:10px;justify-content:flex-start;}
  .pct-wrap{min-width:0;width:100%;}
  .modal{max-width:94vw;}
  .modal-body{padding:16px;}
  .gantt-row{grid-template-columns:140px 1fr;}
}
</style>
</head>
<body>

<div class="mobile-topbar">
  <button class="hamburger" id="btnHamburger" aria-label="Меню">☰</button>
  <span class="mt-title">Habit Ops</span>
</div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">Э</div>
    <div>
      <div class="brand-title">Панель эффективности</div>
      <div class="brand-sub">Habit Ops</div>
    </div>
    <button class="sidebar-close" id="btnSidebarClose" aria-label="Закрыть меню">✕</button>
  </div>

  <div class="nav-group-label">Учёт</div>
  <button class="nav-item" data-view="today"><span class="num">01</span>Сегодня</button>
  <button class="nav-item" data-view="week"><span class="num">02</span>Неделя</button>
  <button class="nav-item" data-view="month"><span class="num">03</span>Месяц</button>
  <button class="nav-item" data-view="alltime"><span class="num">04</span>Итоги за период</button>

  <div class="nav-group-label">Управление</div>
  <button class="nav-item" data-view="habits"><span class="num">05</span>Привычки и категории</button>
  <button class="nav-item" data-view="strategy"><span class="num">06</span>Стратегический план</button>

  <div class="sidebar-foot">
    <button class="io-btn" id="btnExport">⤓ Сохранить копию (.json)</button>
    <button class="io-btn" id="btnImport">⤒ Загрузить копию (.json)</button>
    <input type="file" id="fileImport" accept="application/json" style="display:none;">
    <button class="io-btn" id="btnClear" style="color:#E8A6A0;">🗑 Очистить данные</button>
    <button class="io-btn" id="btnSync">☁ Синхронизация</button>
    <div class="save-state" id="saveState">Автосохранение включено</div>
    <div class="save-state" id="syncState" style="opacity:.75;"></div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <div class="eyebrow" id="topEyebrow">Ежедневный учёт</div>
      <h1 id="topTitle">Сегодня</h1>
      <div class="desc" id="topDesc">Отмечайте выполнение привычек по категориям</div>
    </div>
    <div id="topActions"></div>
  </div>
  <div class="content" id="content"></div>
</main>

<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ДАННЫЕ / STATE
   ========================================================= */
const DOW = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DOW_FULL = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const CAT_COLORS = ['#1E7F72','#B8912F','#5B6EE1','#C1443A','#8A56AC','#2F8FBF','#C2703D'];

function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayISO(){ return toISO(new Date()); }
function startOfWeek(d){ const day=(d.getDay()+6)%7; const r=new Date(d); r.setDate(d.getDate()-day); r.setHours(0,0,0,0); return r; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function weekKeyOf(d){ return toISO(startOfWeek(d)); }
function monthKeyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function fmtShort(d){ return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3).toLowerCase(); }
function fmtDate(iso){ const d=parseISO(iso); return d.getDate()+' '+MONTHS[d.getMonth()].toLowerCase()+' '+d.getFullYear(); }

function seedData(){
  const cats = [
    {id:'cat_nutrition', name:'Питание', color:CAT_COLORS[0]},
    {id:'cat_sport', name:'Спорт и тело', color:CAT_COLORS[1]},
    {id:'cat_mind', name:'Ментальное здоровье', color:CAT_COLORS[2]},
  ];
  const habits = [
    {id:'h_water', name:'Водный баланс', description:'Пить воду равномерно в течение дня, не менее 2000 мл. Кофе и чай не считаются.', categoryId:'cat_nutrition', trackingType:'percentage', target:2000, unit:'мл', stepSize:100, cadence:'daily', segments:['Утро','День','Вечер'], active:true, createdAt:todayISO()},
    {id:'h_sugar', name:'Отказ от сладкого', description:'Никакого сахара, сладкой выпечки и сладких напитков в течение дня. Фрукты — можно.', categoryId:'cat_nutrition', trackingType:'binary', target:null, unit:'', cadence:'daily', segments:[], active:true, createdAt:todayISO()},
    {id:'h_meals', name:'Режим питания', description:'Приём пищи в фиксированные окна: завтрак, обед, ужин — без перекусов между ними.', categoryId:'cat_nutrition', trackingType:'binary', target:null, unit:'', cadence:'daily', segments:['Утро','День','Вечер'], active:true, createdAt:todayISO()},
    {id:'h_gym', name:'Тренировка в зале', description:'Силовая тренировка от 40 минут: разминка, основной блок, заминка.', categoryId:'cat_sport', trackingType:'binary', target:null, unit:'', cadence:'weekly', freq:2, segments:[], active:true, createdAt:todayISO()},
    {id:'h_steps', name:'10 000 шагов', description:'Суммарно за день — по данным телефона или часов, включая прогулки и бытовую активность.', categoryId:'cat_sport', trackingType:'percentage', target:10000, unit:'шагов', stepSize:500, cadence:'daily', segments:[], active:true, createdAt:todayISO()},
    {id:'h_journal', name:'Дневник благодарности', description:'Коротко записать 3 вещи, за которые благодарен сегодня — утром и вечером.', categoryId:'cat_mind', trackingType:'binary', target:null, unit:'', cadence:'daily', segments:['Утро','Вечер'], active:true, createdAt:todayISO()},
    {id:'h_read', name:'Чтение книги', description:'Минимум 20 страниц художественной или нон-фикшн литературы за раз, не считая рабочих текстов.', categoryId:'cat_mind', trackingType:'binary', target:null, unit:'', cadence:'monthly', freq:8, segments:[], active:true, createdAt:todayISO()},
  ];
  const plan = [
    {id:uid('plan'), habitId:'h_gym', goal:'Тренировка засчитывается, если длится от 40 минут и включает силовую часть.',
      phases:[
        {id:uid('ph'), name:'Адаптация: 1 раз в неделю', start:toISO(addDays(new Date(),-14)), end:toISO(addDays(new Date(),-7)), note:'Любой день, цель — сформировать привычку приходить в зал.'},
        {id:uid('ph'), name:'Закрепление: 2 раза в неделю', start:toISO(addDays(new Date(),-7)), end:toISO(addDays(new Date(),14)), note:'Фиксированные дни выбираются в начале каждой недели.'},
        {id:uid('ph'), name:'Рост нагрузки: 3 раза в неделю', start:toISO(addDays(new Date(),14)), end:toISO(addDays(new Date(),45)), note:'Добавляется третий день, отслеживается рабочий вес.'},
      ]},
    {id:uid('plan'), habitId:'h_water', goal:'День засчитан на 100%, если выпито не менее 2000 мл воды.',
      phases:[
        {id:uid('ph'), name:'Базовый уровень: 1200 мл', start:toISO(addDays(new Date(),-10)), end:toISO(addDays(new Date(),4)), note:'Приучение к бутылке воды на столе.'},
        {id:uid('ph'), name:'Целевой уровень: 2000 мл', start:toISO(addDays(new Date(),4)), end:toISO(addDays(new Date(),34)), note:'Полный целевой объём, контроль по времени суток.'},
      ]},
  ];

  // -------- демонстрационная история за последние ~3 недели --------
  const entries = {};
  const weeklyAssignments = {};
  const monthlyAssignments = {};
  const today = new Date();

  for(let back=20; back>=0; back--){
    const d = addDays(today, -back);
    const iso = toISO(d);
    // водный баланс: общий итог обычно близко к цели (2000 мл); распределение по частям
    // дня разное — где-то ровно, где-то вода выпита рывком вечером (для наглядности в аналитике).
    const totalW = (back%6===0) ? 900 : (1600 + (back*37)%700);
    let mW, dW, eW;
    if(back===4){ mW=100; dW=150; eW=Math.max(0,totalW-250); }
    else if(back===10){ mW=250; dW=250; eW=Math.max(0,totalW-500); }
    else { mW=Math.round(totalW*0.32); dW=Math.round(totalW*0.34); eW=Math.max(0,totalW-mW-dW); }
    entries[entryKey('h_water', iso, 'Утро')] = mW;
    entries[entryKey('h_water', iso, 'День')] = dW;
    entries[entryKey('h_water', iso, 'Вечер')] = eW;
    // отказ от сладкого: в основном да, пара срывов
    entries[entryKey('h_sugar', iso, null)] = !(back===3 || back===9);
    // режим питания: сегменты утро/день/вечер
    entries[entryKey('h_meals', iso, 'Утро')] = true;
    entries[entryKey('h_meals', iso, 'День')] = !(back===2 || back===11);
    entries[entryKey('h_meals', iso, 'Вечер')] = !(back===5);
    // шаги
    entries[entryKey('h_steps', iso, null)] = 5000 + ((back*613)%7000);
    // дневник благодарности: утро/вечер
    entries[entryKey('h_journal', iso, 'Утро')] = !(back===7 || back===14);
    entries[entryKey('h_journal', iso, 'Вечер')] = !(back===1 || back===8 || back===16);
  }

  // тренировка в зале — 2 раза в неделю, за последние 3 недели + текущая (частично)
  for(let wBack=3; wBack>=0; wBack--){
    const ws = startOfWeek(addDays(today, -7*wBack));
    const wk = weekKeyOf(ws);
    // дни тренировок — вторник и пятница той недели
    const tue = toISO(addDays(ws,1)), fri = toISO(addDays(ws,4));
    weeklyAssignments['h_gym|'+wk] = [tue, fri];
    if(wBack>0){
      entries[entryKey('h_gym', tue, null)] = !(wBack===2);
      entries[entryKey('h_gym', fri, null)] = true;
    } else {
      // текущая неделя: отмечаем только вторник, чтобы наглядно показать частичное
      // выполнение нормы (2х/неделю) в аналитике — пятница ещё "не сделана".
      if(parseDateSafe(tue) <= today) entries[entryKey('h_gym', tue, null)] = true;
    }
  }

  // чтение книги — до 8 раз в месяц, назначаем и частично выполняем текущий и прошлый месяц
  [0,1].forEach(mBack=>{
    const mDate = new Date(today.getFullYear(), today.getMonth()-mBack, 1);
    const mk = monthKeyOf(mDate);
    const nd = daysInMonth(mDate.getFullYear(), mDate.getMonth());
    const step = Math.max(1, Math.floor(nd/8));
    const dates = [];
    for(let i=1; i<=nd && dates.length<8; i+=step){ dates.push(toISO(new Date(mDate.getFullYear(), mDate.getMonth(), i))); }
    monthlyAssignments['h_read|'+mk] = dates;
    dates.forEach((iso,idx)=>{
      if(parseDateSafe(iso) > today) return;
      entries[entryKey('h_read', iso, null)] = !(mBack===0 && idx>=dates.length-2); // последние 1-2 в этом месяце ещё не прочитаны
    });
  });

  return {categories:cats, habits:habits, entries:entries, weeklyAssignments:weeklyAssignments, monthlyAssignments:monthlyAssignments, strategicPlan:plan};
}
function parseDateSafe(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }

let state = null;

function loadState(){
  try{
    const raw = localStorage.getItem('habitops_state_v1');
    if(raw){ state = JSON.parse(raw); migrateTargetHistory(); return; }
  }catch(e){ /* localStorage недоступен в этом окружении — работаем в памяти */ }
  state = seedData();
  migrateTargetHistory();
}
function migrateTargetHistory(){
  (state.habits||[]).forEach(h=>{
    if(h.trackingType==='percentage' && (!h.targetHistory || !h.targetHistory.length)){
      h.targetHistory = [{date:(h.createdAt||'1970-01-01').slice(0,10), target:h.target}];
    }
  });
}
function saveState(){
  state.updatedAt = Date.now();
  try{
    localStorage.setItem('habitops_state_v1', JSON.stringify(state));
    document.getElementById('saveState').textContent = 'Сохранено · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    document.getElementById('saveState').textContent = 'Память сессии — сохраняйте копию вручную';
  }
  scheduleCloudPush();
}
function entryKey(habitId,date,segment){ return habitId+'|'+date+'|'+(segment||'_'); }

function loadExampleData(){
  if((state.categories.length || state.habits.length) && !confirm('Текущие данные будут заменены примером. Продолжить?')) return;
  state = seedData();
  saveState(); toast('Приложение заполнено примером'); render();
}

/* =========================================================
   ЛОГИКА ПРИВЫЧЕК: назначение дней для weekly/monthly
   ========================================================= */
function getWeeklyAssignment(habit, wk){
  return state.weeklyAssignments[habit.id+'|'+wk] || null;
}
function setWeeklyAssignment(habit, wk, dates){
  state.weeklyAssignments[habit.id+'|'+wk] = dates; saveState();
}
function getMonthlyAssignment(habit, mk){
  return state.monthlyAssignments[habit.id+'|'+mk] || null;
}
function setMonthlyAssignment(habit, mk, dates){
  state.monthlyAssignments[habit.id+'|'+mk] = dates; saveState();
}

function isHabitScheduledOn(habit, dateObj){
  const iso = toISO(dateObj);
  if(habit.cadence==='daily') return true;
  if(habit.cadence==='weekly'){
    const wk = weekKeyOf(dateObj);
    const a = getWeeklyAssignment(habit, wk);
    return a ? a.includes(iso) : false;
  }
  if(habit.cadence==='monthly'){
    const mk = monthKeyOf(dateObj);
    const a = getMonthlyAssignment(habit, mk);
    return a ? a.includes(iso) : false;
  }
  return false;
}

function habitsNeedingAssignment(refDate){
  const wk = weekKeyOf(refDate), mk = monthKeyOf(refDate);
  return state.habits.filter(h=>h.active && (
    (h.cadence==='weekly' && !getWeeklyAssignment(h,wk)) ||
    (h.cadence==='monthly' && !getMonthlyAssignment(h,mk))
  ));
}

/* =========================================================
   ЗАПИСИ (entries)
   ========================================================= */
function getEntry(habitId,date,segment){
  const v = state.entries[entryKey(habitId,date,segment)];
  return v===undefined ? null : v;
}
function setEntry(habitId,date,segment,value){
  state.entries[entryKey(habitId,date,segment)] = value; saveState();
}
function targetForDate(habit, date){
  // Возвращает значение цели, которое действовало на указанную дату — если цель позже
  // меняли, за прошлые дни используется та цель, что была актуальна тогда, а не текущая.
  const hist = habit.targetHistory;
  if(!hist || !hist.length) return habit.target;
  let t = hist[0].target;
  for(let i=0;i<hist.length;i++){
    if(hist[i].date<=date) t = hist[i].target; else break;
  }
  return t;
}
function habitDayValue(habit, date, raw){
  // возвращает 0..100 (или больше, если raw=true) — процент выполнения привычки за день, с учётом сегментов
  if(habit.trackingType==='percentage'){
    const target = targetForDate(habit, date);
    if(habit.segments && habit.segments.length){
      // Проценты с частями дня: общий итог за день = сумма фактических значений по частям.
      let any=false, actualTotal=0;
      habit.segments.forEach(s=>{ const v=getEntry(habit.id,date,s); if(v!==null){ any=true; actualTotal+=v; } });
      if(!any) return null;
      const pct = Math.round(actualTotal/target*100);
      return raw ? Math.max(0,pct) : Math.max(0, Math.min(100, pct));
    }
    const v = getEntry(habit.id,date,null);
    if(v===null) return null;
    const pct = Math.round((v/target)*100);
    return raw ? Math.max(0,pct) : Math.max(0, Math.min(100, pct));
  }
  const segs = (habit.segments&&habit.segments.length) ? habit.segments : [null];
  let done=0, total=segs.length, any=false;
  segs.forEach(s=>{ const v=getEntry(habit.id,date,s); if(v!==null){any=true;} if(v===true) done++; });
  if(!any) return null;
  return Math.round((done/total)*100);
}

/* ---------------------------------------------------------------
   Аналитика для привычек с гибкой периодичностью (N раз в неделю / в месяц).
   Важно: результат считается НЕ как среднее по фактически отмеченным дням,
   а как отношение "набрано баллов / норма (freq)". Так, привычка "зал 2х/неделю",
   выполненная только 1 раз, даёт 50%, а не 100% — недостающие сессии
   (уже прошедшие и не назначенные/не выполненные) учитываются как 0.
   Ещё не наступившие дни периода в расчёт пока не берутся (период не завершён).
   ------------------------------------------------------------- */
function endOfToday(){ const t=new Date(); t.setHours(23,59,59,999); return t; }

function habitWeekCompletion(h, weekStart, raw){
  // h.cadence === 'weekly'. Возвращает 0..100 (или больше, если raw) либо null, если по этой неделе ещё нет данных.
  // Каждый уже наступивший (в т.ч. сегодняшний) запланированный день учитывается в сумме —
  // если по нему пока нет записи, он просто даёт 0, а не исключается из расчёта.
  let sum=0, counted=false;
  const today = endOfToday();
  for(let i=0;i<7;i++){
    const d = addDays(weekStart,i);
    if(d>today) continue;
    if(!isHabitScheduledOn(h,d)) continue;
    const v = habitDayValue(h, toISO(d), raw);
    counted = true;
    sum += (v===null?0:v);
  }
  if(!counted) return null;
  const res = Math.round(sum / h.freq);
  return raw ? res : Math.min(100, res);
}
function habitMonthCompletion(h, monthStartDate, raw){
  // h.cadence === 'monthly'. Возвращает 0..100 (или больше, если raw) либо null.
  const y=monthStartDate.getFullYear(), m=monthStartDate.getMonth();
  const nd = daysInMonth(y,m);
  let sum=0, counted=false;
  const today = endOfToday();
  for(let dnum=1; dnum<=nd; dnum++){
    const d = new Date(y,m,dnum);
    if(d>today) continue;
    if(!isHabitScheduledOn(h,d)) continue;
    const v = habitDayValue(h, toISO(d), raw);
    counted = true;
    sum += (v===null?0:v);
  }
  if(!counted) return null;
  const res = Math.round(sum / h.freq);
  return raw ? res : Math.min(100, res);
}
function weeksOverlappingMonth(y,m){
  const first = new Date(y,m,1), last = new Date(y,m,daysInMonth(y,m));
  let ws = startOfWeek(first);
  const weeks = [];
  while(ws<=last){ weeks.push(new Date(ws)); ws = addDays(ws,7); }
  return weeks;
}
function habitWeeklyHabitMonthAvg(h, y, m, raw){
  // Для привычки "N раз/неделю" — средняя по всем неделям, затрагивающим этот месяц.
  const vals = weeksOverlappingMonth(y,m).map(ws=>habitWeekCompletion(h,ws,raw)).filter(v=>v!==null);
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function habitWeeklyAllTimeAvg(h, startDate, endDate, raw){
  let ws = startOfWeek(startDate); const vals=[];
  while(ws<=endDate){ const v=habitWeekCompletion(h,ws,raw); if(v!==null) vals.push(v); ws=addDays(ws,7); }
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function habitMonthlyAllTimeAvg(h, startDate, endDate, raw){
  let mc = new Date(startDate.getFullYear(), startDate.getMonth(),1);
  const endM = new Date(endDate.getFullYear(), endDate.getMonth(),1);
  const vals=[];
  while(mc<=endM){ const v=habitMonthCompletion(h,mc,raw); if(v!==null) vals.push(v); mc=new Date(mc.getFullYear(),mc.getMonth()+1,1); }
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function habitDailyRangeAvg(h, rangeStart, rangeEndInclusive, raw){
  // Знаменатель — количество уже НАСТУПИВШИХ (прошедших либо сегодняшнего) запланированных
  // дней в диапазоне, а не только тех, где уже есть запись. Если запись пока не внесена —
  // день всё равно засчитывается, просто с результатом 0, пока пользователь его не заполнит.
  let sum=0, cnt=0; const today=endOfToday();
  let d = new Date(rangeStart);
  while(d<=rangeEndInclusive){
    if(d<=today && isHabitScheduledOn(h,d)){
      const v = habitDayValue(h,toISO(d),raw);
      sum += (v===null?0:v);
      cnt++;
    }
    d = addDays(d,1);
  }
  return cnt? Math.round(sum/cnt) : null;
}
// Универсальный показатель привычки за конкретную неделю (для таблицы/графика недели
// и для помесячной "динамики по неделям"). Для monthly-привычек это лишь фрагмент —
// среднее по дням этой недели, которые ей назначены (полноценная норма считается по месяцу).
function habitScoreForWeek(h, weekStart, raw){
  if(h.cadence==='weekly') return habitWeekCompletion(h, weekStart, raw);
  if(h.cadence==='monthly') return habitDailyRangeAvg(h, weekStart, addDays(weekStart,6), raw);
  return habitDailyRangeAvg(h, weekStart, addDays(weekStart,6), raw);
}
// Универсальный показатель привычки за конкретный месяц (для таблицы/графика месяца
// и для "средней эффективности за месяц" в общей истории).
function habitScoreForMonth(h, y, m, raw){
  const monthStart = new Date(y,m,1), monthEnd = new Date(y,m,daysInMonth(y,m));
  if(h.cadence==='monthly') return habitMonthCompletion(h, monthStart, raw);
  if(h.cadence==='weekly') return habitWeeklyHabitMonthAvg(h, y, m, raw);
  return habitDailyRangeAvg(h, monthStart, monthEnd, raw);
}
// Показатель привычки за весь период наблюдения (для вкладки «Итоги»).
function habitScoreAllTime(h, startDate, endDate){
  if(h.cadence==='weekly') return habitWeeklyAllTimeAvg(h, startDate, endDate);
  if(h.cadence==='monthly') return habitMonthlyAllTimeAvg(h, startDate, endDate);
  return habitDailyRangeAvg(h, startDate, endDate);
}

/* ---------------------------------------------------------------
   Углублённая аналитика для вкладок «Неделя» и «Месяц»:
   средний результат, лучший результат за всю историю (по привычке
   и по всему плану), сравнение с предыдущим периодом.
   ------------------------------------------------------------- */
function trackingStartDate(){
  const allDates = Object.keys(state.entries).map(k=>k.split('|')[1]).filter(Boolean);
  if(!allDates.length) return startOfWeek(new Date());
  const minIso = allDates.reduce((a,b)=>a<b?a:b);
  return parseISO(minIso);
}
// Результат ВСЕГО ПЛАНА (среднее по активным привычкам) за конкретную неделю/месяц.
function planScoreForWeek(ws){
  const scores = state.habits.filter(h=>h.active).map(h=>habitScoreForWeek(h,ws)).filter(v=>v!==null);
  return scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
}
function planScoreForMonth(y,m){
  const scores = state.habits.filter(h=>h.active).map(h=>habitScoreForMonth(h,y,m)).filter(v=>v!==null);
  return scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
}
// Лучшая неделя/месяц за всю историю — и по всему плану, и по отдельной привычке.
function bestWeekEver(){
  let ws = startOfWeek(trackingStartDate()); const end = new Date();
  let best=null, bestStart=null;
  while(ws<=end){ const v=planScoreForWeek(ws); if(v!==null && (best===null||v>best)){ best=v; bestStart=new Date(ws); } ws=addDays(ws,7); }
  return {score:best, start:bestStart};
}
function bestMonthEver(){
  const start = trackingStartDate(); const end = new Date();
  let mc = new Date(start.getFullYear(), start.getMonth(), 1); const endM = new Date(end.getFullYear(), end.getMonth(), 1);
  let best=null, bestM=null;
  while(mc<=endM){ const v=planScoreForMonth(mc.getFullYear(), mc.getMonth()); if(v!==null && (best===null||v>best)){ best=v; bestM=new Date(mc); } mc=new Date(mc.getFullYear(), mc.getMonth()+1, 1); }
  return {score:best, month:bestM};
}
function bestWeekForHabit(h){
  let ws = startOfWeek(trackingStartDate()); const end = new Date();
  let best=null;
  while(ws<=end){ const v=habitScoreForWeek(h,ws,true); if(v!==null && (best===null||v>best)) best=v; ws=addDays(ws,7); }
  return best;
}
function bestMonthForHabit(h){
  const start = trackingStartDate(); const end = new Date();
  let mc = new Date(start.getFullYear(), start.getMonth(), 1); const endM = new Date(end.getFullYear(), end.getMonth(), 1);
  let best=null;
  while(mc<=endM){ const v=habitScoreForMonth(h, mc.getFullYear(), mc.getMonth(), true); if(v!==null && (best===null||v>best)) best=v; mc=new Date(mc.getFullYear(), mc.getMonth()+1, 1); }
  return best;
}
function trendArrow(delta){
  if(delta===null) return `<span style="color:var(--muted);">—</span>`;
  if(delta===0) return `<span style="color:var(--muted);">± 0%</span>`;
  const up = delta>0;
  return `<span style="color:${up?'var(--accent)':'var(--danger)'};">${up?'▲':'▼'} ${up?'+':''}${delta}%</span>`;
}
/* =========================================================
   РЕНДЕР: ROOT
   ========================================================= */
function render(){
  setActiveNav();
  const map = {today:renderToday, week:renderWeek, month:renderMonth, alltime:renderAllTime, habits:renderHabits, strategy:renderStrategy};
  (map[currentView]||renderToday)();
}

function setTop(eyebrow,title,desc,actionsHTML){
  document.getElementById('topEyebrow').textContent=eyebrow;
  document.getElementById('topTitle').textContent=title;
  document.getElementById('topDesc').textContent=desc;
  document.getElementById('topActions').innerHTML = actionsHTML||'';
}

/* =========================================================
   ВИД: СЕГОДНЯ
   ========================================================= */
function renderToday(){
  const d = new Date(todayCursor);
  const iso = toISO(d);
  const isRealToday = iso===todayISO();
  const dayNav = `<div class="fin-nav" style="margin-left:auto;">
    <button onclick="changeTodayCursor(-1)">‹</button>
    <span class="fin-month-label" style="min-width:auto;">${isRealToday?'Сегодня':fmtDate(iso)}</span>
    <button onclick="changeTodayCursor(1)" ${isRealToday?'disabled style="opacity:.35;cursor:default;"':''}>›</button>
    ${isRealToday?'':'<button class="btn btn-sm" onclick="goToToday()" style="margin-left:6px;">Сегодня</button>'}
  </div>`;
  setTop('Ежедневный учёт','Сегодня, '+DOW_FULL[(d.getDay()+6)%7].toLowerCase()+', '+fmtDate(iso), 'Отмечайте выполнение привычек по категориям', dayNav);
  const c = document.getElementById('content');
  let html = '';

  const needing = isRealToday ? habitsNeedingAssignment(d) : [];
  if(needing.length){
    html += `<div class="banner"><div><strong>Нужно выбрать дни выполнения</strong><p>Для ${needing.length} привыч${needing.length===1?'ки':'ек'} с гибким графиком не назначены дни на текущий период.</p></div><button class="btn btn-primary btn-sm" onclick="openAssignModal()">Назначить дни</button></div>`;
  }

  const activeHabits = state.habits.filter(h=>h.active);
  const scheduledToday = activeHabits.filter(h=>isHabitScheduledOn(h,d));
  const completion = scheduledToday.length ? Math.round(scheduledToday.reduce((s,h)=>s+(habitDayValue(h,iso)||0),0)/scheduledToday.length) : 0;

  html += `<div class="grid cols-3" style="margin-bottom:26px;">
    <div class="stat"><div class="label">Запланировано${isRealToday?' сегодня':' на этот день'}</div><div class="value">${scheduledToday.length}</div><div class="sub">из ${activeHabits.length} активных привычек</div></div>
    <div class="stat"><div class="label">Средний прогресс дня</div><div class="value">${completion}%</div><div class="sub">по всем привычкам за этот день</div></div>
    <div class="stat"><div class="label">Категорий в работе</div><div class="value">${new Set(scheduledToday.map(h=>h.categoryId)).size}</div><div class="sub">из ${state.categories.length} всего</div></div>
  </div>`;

  if(!activeHabits.length){
    html += emptyState('Пока нет привычек','Добавьте первую привычку на вкладке «Привычки и категории».','habits');
    html += `<div style="text-align:center;margin-top:-10px;"><button class="btn" onclick="loadExampleData()">Заполнить примером данных</button></div>`;
  } else {
    state.categories.forEach(cat=>{
      const hs = scheduledToday.filter(h=>h.categoryId===cat.id);
      const allInCat = activeHabits.filter(h=>h.categoryId===cat.id);
      if(!allInCat.length) return;
      html += `<div class="cat-block"><div class="cat-head"><span class="cat-dot" style="background:${cat.color}"></span><h3>${cat.name}</h3><span class="cat-count">${hs.length}/${allInCat.length}${isRealToday?' сегодня':''}</span></div>`;
      if(!hs.length){
        html += `<div style="font-size:12px;color:var(--muted);padding:4px 2px 8px 2px;">На этот день по этой категории привычек не запланировано.</div>`;
      }
      hs.forEach(h=> html += habitRowToday(h, iso));
      html += `</div>`;
    });
  }
  c.innerHTML = html;
}
function changeTodayCursor(delta){
  const next = addDays(todayCursor, delta);
  if(next > endOfToday()) return; // нельзя уйти в будущее
  todayCursor = next;
  render();
}
function goToToday(){
  todayCursor = new Date();
  render();
}

function habitRowToday(h, iso){
  const cadgeLabel = h.cadence==='daily' ? 'Ежедневно' : h.cadence==='weekly' ? `${h.freq}×/неделю` : `${h.freq}×/месяц`;
  let controls = '';
  if(h.trackingType==='percentage' && h.segments && h.segments.length){
    const step = h.stepSize||1;
    const target = targetForDate(h, iso);
    let total=0;
    const segInputs = h.segments.map(s=>{
      const v = getEntry(h.id,iso,s) || 0; total += v;
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
        <div class="pct-input-row">
          <button class="pct-step sm" onclick="bumpPct('${h.id}','${iso}','${s}',-${step})">−</button>
          <input class="pct-input" style="width:48px;" type="number" min="0" value="${v}" onchange="onSegPctChange('${h.id}','${iso}','${s}',this.value)">
          <button class="pct-step sm" onclick="bumpPct('${h.id}','${iso}','${s}',${step})">+</button>
        </div>
        <span style="font-size:9px;color:var(--muted);text-align:center;white-space:nowrap;">${s}</span>
      </div>`;
    }).join('');
    const pct = Math.max(0, Math.round(total/target*100));
    controls = `<div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
      <div style="display:flex;gap:10px;">${segInputs}</div>
      <span class="tag mono">Итого: ${total}/${target} ${h.unit} · ${pct}%</span>
    </div>`;
  } else if(h.trackingType==='percentage'){
    const step = h.stepSize||1;
    const target = targetForDate(h, iso);
    const v = getEntry(h.id, iso, null) || 0;
    const pct = Math.max(0, Math.round((v/target)*100));
    controls = `<div class="pct-wrap">
      <div class="pct-input-row">
        <button class="pct-step" onclick="bumpPct('${h.id}','${iso}',null,-${step})">−</button>
        <input class="pct-input" type="number" min="0" value="${v}" onchange="onPctChange('${h.id}','${iso}',this.value)">
        <button class="pct-step" onclick="bumpPct('${h.id}','${iso}',null,${step})">+</button>
      </div>
      <div class="pct-bar"><div class="pct-bar-fill" style="width:${Math.min(100,pct)}%"></div></div>
      <span class="tag mono">${pct}%</span>
    </div>`;
  } else if(h.segments && h.segments.length){
    controls = `<div class="habit-controls">` + h.segments.map(s=>{
      const done = getEntry(h.id,iso,s)===true;
      return `<div style="position:relative;margin-bottom:6px;"><button class="seg-toggle ${done?'done':''}" onclick="onSegToggle('${h.id}','${iso}','${s}')">${done?'✓':''}</button><span class="seg-label">${s}</span></div>`;
    }).join('') + `</div>`;
  } else {
    const done = getEntry(h.id,iso,null)===true;
    controls = `<button class="seg-toggle ${done?'done':''}" onclick="onSegToggle('${h.id}','${iso}',null)" style="width:42px;height:42px;font-size:17px;">${done?'✓':''}</button>`;
  }
  return `<div class="habit-row">
    <div class="habit-info">
      <div class="habit-name">${h.name}</div>
      ${h.description?`<div class="habit-desc">${h.description}</div>`:''}
      <div class="habit-meta"><span class="tag">${cadgeLabel}</span>${h.trackingType==='percentage'?`<span class="tag">Цель: ${targetForDate(h,iso)} ${h.unit}</span>`:''}${h.cadence!=='daily'?`<span class="tag" style="cursor:pointer;border-color:var(--accent);color:var(--accent);" onclick="openRescheduleModal('${h.id}')">↻ перенести день</span>`:''}</div>
    </div>
    ${controls}
  </div>`;
}

function onSegPctChange(habitId, iso, seg, val){
  const n = Math.max(0, Number(val)||0);
  setEntry(habitId, iso, seg, n);
  render();
}

function onSegToggle(habitId, iso, seg){
  const cur = getEntry(habitId, iso, seg);
  setEntry(habitId, iso, seg, cur===true ? false : true);
  render();
}
function onPctChange(habitId, iso, val){
  const n = Math.max(0, Number(val)||0);
  setEntry(habitId, iso, null, n);
  render();
}
function bumpPct(habitId, iso, seg, delta){
  const cur = getEntry(habitId, iso, seg) || 0;
  const next = Math.max(0, Math.round((cur + delta)*100)/100);
  setEntry(habitId, iso, seg, next);
  render();
}

function emptyState(title, text, gotoView){
  return `<div class="card empty"><h3>${title}</h3><p>${text}</p><button class="btn btn-primary btn-sm" onclick="currentView='${gotoView}';render();">Перейти</button></div>`;
}

/* =========================================================
   ВИД: НЕДЕЛЯ
   ========================================================= */
function renderWeek(){
  const ws = startOfWeek(weekCursor);
  const we = addDays(ws,6);
  const wk = weekKeyOf(weekCursor);
  const isCurrentWeek = wk===weekKeyOf(new Date());
  setTop('Учёт по неделе', fmtShort(ws)+' — '+fmtShort(we)+', '+ws.getFullYear(),'Прогресс и график за выбранную неделю','');
  document.getElementById('topActions').innerHTML = `<div class="pill-switch">
      <button onclick="weekCursor=addDays(weekCursor,-7);render();">← Пред. неделя</button>
      <button class="${isCurrentWeek?'active':''}" onclick="weekCursor=new Date();render();">Текущая</button>
      <button onclick="weekCursor=addDays(weekCursor,7);render();">След. неделя →</button>
    </div>`;
  const c = document.getElementById('content');
  let html='';

  const needing = habitsNeedingAssignment(ws).filter(h=>h.cadence==='weekly');
  if(needing.length){
    html += `<div class="banner"><div><strong>Выберите дни для этой недели</strong><p>${needing.map(h=>h.name).join(', ')} — дни ещё не назначены.</p></div><button class="btn btn-primary btn-sm" onclick="openAssignModal()">Назначить</button></div>`;
  }

  const activeHabits = state.habits.filter(h=>h.active);

  // -------- сводные показатели недели (по всему плану) --------
  const thisWeekScore = planScoreForWeek(ws);
  const prevWeekScore = planScoreForWeek(addDays(ws,-7));
  const delta = (thisWeekScore!==null && prevWeekScore!==null) ? thisWeekScore-prevWeekScore : null;
  const best = bestWeekEver();
  const isBestWeek = best.score!==null && thisWeekScore!==null && best.start && weekKeyOf(best.start)===wk;

  html += `<div class="grid cols-4" style="margin-bottom:22px;">
    <div class="stat"><div class="label">Средний результат недели</div><div class="value">${thisWeekScore===null?'—':thisWeekScore+'%'}</div><div class="sub">по всем активным привычкам</div></div>
    <div class="stat"><div class="label">К прошлой неделе</div><div class="value" style="font-size:20px;">${trendArrow(delta)}</div><div class="sub">${prevWeekScore===null?'нет данных за пред. неделю':'пред. неделя: '+prevWeekScore+'%'}</div></div>
    <div class="stat"><div class="label">Лучшая неделя за всё время</div><div class="value">${best.score===null?'—':best.score+'%'}</div><div class="sub">${isBestWeek?'это текущая неделя 🏆':(best.start?fmtShort(best.start)+' — '+fmtShort(addDays(best.start,6)):'—')}</div></div>
    <div class="stat"><div class="label">Активных привычек</div><div class="value">${activeHabits.length}</div><div class="sub">учитывается на этой неделе</div></div>
  </div>`;

  // таблица по дням
  html += `<div class="card" style="margin-bottom:22px;overflow-x:auto;"><table><thead><tr><th style="min-width:170px;">Привычка</th>`;
  for(let i=0;i<7;i++){ const d=addDays(ws,i); html+=`<th class="week-cell">${DOW[i]}<br><span class="mono" style="font-weight:400;">${d.getDate()}</span></th>`; }
  html += `<th class="week-cell">Итог</th><th class="week-cell">Рекорд</th></tr></thead><tbody>`;
  activeHabits.forEach(h=>{
    html += `<tr><td><strong>${h.name}</strong>${h.cadence!=='daily'?`<div style="font-size:10.5px;color:var(--muted);margin-top:2px;">норма: ${h.freq}${h.cadence==='weekly'?'×/нед.':'×/мес.'}</div>`:''}</td>`;
    for(let i=0;i<7;i++){
      const d=addDays(ws,i); const iso=toISO(d); const future = d> endOfToday();
      const scheduled = isHabitScheduledOn(h,d);
      if(!scheduled){ html+=`<td class="week-cell">–</td>`; continue; }
      const rawVal = habitDayValue(h,iso,true);
      const val = rawVal===null ? null : Math.min(100, rawVal); // капнутое значение — только для заливки и статуса "done"
      const clickable = !future;
      const isPct = h.trackingType==='percentage';
      const hasSegments = h.segments && h.segments.length;
      const cls = val===100?'done':'';
      let label = '', cellStyle = '';
      if(val!==null){
        if(isPct){
          label = rawVal+'%'; // фактический процент, без ограничения в 100%
          cellStyle = 'font-size:10px;';
        } else if(val===100){
          label = '✓';
        } else if(hasSegments && val>0){
          // Привычка да/нет с частями дня, выполнена частично — вместо цифр показываем
          // галочку поверх квадратика, залитого снизу вверх тем же зелёным, что и у "процента от цели".
          label = '<span class="pc-glyph">✓</span>';
        }
        if(val>0 && val<100){
          cellStyle += `background:linear-gradient(to top, rgba(30,127,114,.42) ${val}%, var(--surface) ${val}%);`;
        }
      }
      html += `<td class="week-cell"><span class="day-check ${cls} ${future?'future':''}" ${clickable?`onclick="quickDayToggle('${h.id}','${iso}')"`:''} style="${cellStyle}">${label}</span></td>`;
    }
    // Итог: для weekly-привычек — доля от нормы (freq) за эту неделю, а не среднее по отмеченным дням.
    let summaryVal;
    if(h.cadence==='weekly'){
      summaryVal = habitWeekCompletion(h, ws);
    } else {
      let sum=0,cnt=0;
      for(let i=0;i<7;i++){ const d=addDays(ws,i); if(!isHabitScheduledOn(h,d)) continue; const val=habitDayValue(h,toISO(d)); cnt++; if(val!==null) sum+=val; }
      summaryVal = cnt ? Math.round(sum/cnt) : null;
    }
    const habitBest = bestWeekForHabit(h);
    html += `<td class="week-cell mono"><strong>${summaryVal===null?'—':summaryVal+'%'}</strong></td><td class="week-cell mono" style="color:var(--muted);">${habitBest===null?'—':habitBest+'%'}</td></tr>`;
  });
  html += `</tbody></table></div>`;

  // график по категориям (среднее по привычкам категории, каждая привычка — со своим корректным показателем)
  html += `<div class="chart-box" style="margin-bottom:22px;"><h4>Выполнение по категориям за неделю</h4><canvas id="weekChart" height="90"></canvas></div>`;
  c.innerHTML = html;

  const catLabels = state.categories.map(c=>c.name);
  const catData = state.categories.map(cat=>{
    const hs = activeHabits.filter(h=>h.categoryId===cat.id);
    const scores = hs.map(h=>habitScoreForWeek(h,ws)).filter(v=>v!==null);
    return scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  });
  drawBarChart('weekChart', catLabels, catData, state.categories.map(c=>c.color));
}

function quickDayToggle(habitId, iso){
  const h = state.habits.find(x=>x.id===habitId);
  if(h.trackingType==='percentage' && h.segments && h.segments.length){
    toast('У привычки несколько частей дня — отметьте её на вкладке «Сегодня»');
    return;
  } else if(h.trackingType==='percentage'){
    const cur = getEntry(habitId,iso,null) || 0;
    const val = prompt('Введите значение ('+h.unit+'), цель — '+h.target+':', cur);
    if(val===null) return;
    setEntry(habitId,iso,null, Math.max(0,Number(val)||0));
  } else if(h.segments && h.segments.length){
    toast('У привычки несколько частей дня — отметьте её на вкладке «Сегодня»');
    return;
  } else {
    const cur = getEntry(habitId,iso,null);
    setEntry(habitId,iso,null, cur===true?false:true);
  }
  render();
}

/* =========================================================
   ВИД: МЕСЯЦ
   ========================================================= */
function renderMonth(){
  const y=monthCursor.getFullYear(), m=monthCursor.getMonth();
  const mk = monthKeyOf(monthCursor);
  const isCurrentMonth = mk===monthKeyOf(new Date());
  setTop('Учёт по месяцу', MONTHS[m]+' '+y,'Показатели и график автоматически пересчитываются для выбранного месяца','');
  document.getElementById('topActions').innerHTML = `<div class="pill-switch">
      <button onclick="monthCursor=new Date(${y},${m-1},1);render();">← Пред. месяц</button>
      <button class="${isCurrentMonth?'active':''}" onclick="monthCursor=new Date();render();">Текущий</button>
      <button onclick="monthCursor=new Date(${y},${m+1},1);render();">След. месяц →</button>
    </div>`;

  const c = document.getElementById('content');
  let html='';

  const needing = habitsNeedingAssignment(new Date(y,m,1)).filter(h=>h.cadence==='monthly');
  if(needing.length){
    html += `<div class="banner"><div><strong>Выберите даты на этот месяц</strong><p>${needing.map(h=>h.name).join(', ')} — дни ещё не назначены.</p></div><button class="btn btn-primary btn-sm" onclick="openAssignModal()">Назначить</button></div>`;
  }

  const activeHabits = state.habits.filter(h=>h.active);
  const nd = daysInMonth(y,m);
  const perHabit = activeHabits.map(h=>{
    const score = habitScoreForMonth(h, y, m);
    return {h, avg: score, best: bestMonthForHabit(h)};
  });
  const habitScores = perHabit.map(p=>p.avg).filter(v=>v!==null);
  const overallAvg = habitScores.length ? Math.round(habitScores.reduce((a,b)=>a+b,0)/habitScores.length) : null;

  const prevMonthDate = new Date(y,m-1,1);
  const prevScore = planScoreForMonth(prevMonthDate.getFullYear(), prevMonthDate.getMonth());
  const delta = (overallAvg!==null && prevScore!==null) ? overallAvg-prevScore : null;
  const best = bestMonthEver();
  const isBestMonth = best.score!==null && overallAvg!==null && best.month && monthKeyOf(best.month)===mk;

  html += `<div class="grid cols-4" style="margin-bottom:24px;">
    <div class="stat"><div class="label">Средний результат месяца</div><div class="value">${overallAvg===null?'—':overallAvg+'%'}</div><div class="sub">среднее по всем привычкам, с учётом нормы</div></div>
    <div class="stat"><div class="label">К прошлому месяцу</div><div class="value" style="font-size:20px;">${trendArrow(delta)}</div><div class="sub">${prevScore===null?'нет данных за пред. месяц':'пред. месяц: '+prevScore+'%'}</div></div>
    <div class="stat"><div class="label">Лучший месяц за всё время</div><div class="value">${best.score===null?'—':best.score+'%'}</div><div class="sub">${isBestMonth?'это текущий месяц 🏆':(best.month?MONTHS[best.month.getMonth()]+' '+best.month.getFullYear():'—')}</div></div>
    <div class="stat"><div class="label">Активных привычек</div><div class="value">${activeHabits.length}</div><div class="sub">${nd} дн. в ${MONTHS[m].toLowerCase()}е</div></div>
  </div>`;

  html += `<div class="grid cols-2" style="margin-bottom:22px;">
    <div class="chart-box"><h4>Прогресс по привычкам</h4><canvas id="monthChartHabits" height="160"></canvas></div>
    <div class="chart-box"><h4>Динамика по неделям месяца</h4><canvas id="monthChartWeeks" height="160"></canvas></div>
  </div>`;

  html += `<div class="card"><table><thead><tr><th>Привычка</th><th>Категория</th><th>Норма</th><th>Результат за месяц</th><th>Рекорд (за всё время)</th></tr></thead><tbody>`;
  perHabit.forEach(p=>{
    const cat = state.categories.find(c=>c.id===p.h.categoryId);
    const norm = p.h.cadence==='daily' ? 'Ежедневно' : p.h.cadence==='weekly' ? p.h.freq+'×/неделю' : p.h.freq+'×/месяц';
    html += `<tr><td><strong>${p.h.name}</strong></td><td><span class="tag" style="border-color:${cat?cat.color:'#ccc'};color:${cat?cat.color:'#666'};">${cat?cat.name:'—'}</span></td><td class="mono" style="font-size:11.5px;">${norm}</td><td class="mono"><strong>${p.avg===null?'—':p.avg+'%'}</strong></td><td class="mono" style="color:var(--muted);">${p.best===null?'—':p.best+'%'}</td></tr>`;
  });
  html += `</tbody></table></div>`;
  c.innerHTML = html;

  drawBarChart('monthChartHabits', perHabit.map(p=>p.h.name), perHabit.map(p=>p.avg||0), activeHabits.map(h=>{const cat=state.categories.find(c=>c.id===h.categoryId); return cat?cat.color:'#999';}));

  // недельная динамика внутри месяца — по каждой привычке считаем её корректный
  // показатель за неделю (для weekly-привычек — доля от нормы), затем усредняем по привычкам.
  const weeksInMonth = [];
  let cursor = new Date(y,m,1);
  while(cursor.getMonth()===m){
    const ws = startOfWeek(cursor);
    if(!weeksInMonth.find(w=>w.key===weekKeyOf(cursor))) weeksInMonth.push({key:weekKeyOf(cursor), start:new Date(ws), label:'Нед. '+(weeksInMonth.length+1)});
    cursor = addDays(cursor,7);
  }
  const weekAverages = weeksInMonth.map(w=>{
    const scores = activeHabits.map(h=>habitScoreForWeek(h, w.start)).filter(v=>v!==null);
    return scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  });
  drawLineChart('monthChartWeeks', weeksInMonth.map(w=>w.label), weekAverages);
}

/* =========================================================
   ВИД: ИТОГИ ЗА ВЕСЬ ПЕРИОД
   ========================================================= */
function renderAllTime(){
  setTop('Сводная статистика','Итоги за весь период','Накопительная история по всем месяцам с момента старта');
  const c = document.getElementById('content');
  const activeHabits = state.habits.filter(h=>h.active);

  // определить диапазон дат по записям
  const allDates = Object.keys(state.entries).map(k=>k.split('|')[1]).filter(Boolean);
  let minDate = allDates.length ? allDates.reduce((a,b)=>a<b?a:b) : todayISO();
  minDate = allDates.length ? minDate : todayISO();
  const start = parseISO(minDate);
  const end = new Date();

  let bestStreakOverall = 0;
  const perHabit = activeHabits.map(h=>{
    // «Лучшая серия» — подряд идущие выполненные сессии (по дням, когда привычка была назначена).
    let running=0, bestStreak=0;
    let d = new Date(start);
    while(d<=end){
      if(isHabitScheduledOn(h,d) && d<=endOfToday()){
        const v = habitDayValue(h, toISO(d));
        if(v===100){ running++; bestStreak=Math.max(bestStreak,running); } else if(v!==null || d<endOfToday()) running=0;
      }
      d = addDays(d,1);
    }
    bestStreakOverall = Math.max(bestStreakOverall, bestStreak);
    const avg = habitScoreAllTime(h, start, end);
    return {h, avg, bestStreak};
  });
  const habitScores = perHabit.map(p=>p.avg).filter(v=>v!==null);
  const overallAvg = habitScores.length ? Math.round(habitScores.reduce((a,b)=>a+b,0)/habitScores.length) : 0;

  const months = [];
  let mc = new Date(start.getFullYear(), start.getMonth(), 1);
  const endM = new Date(end.getFullYear(), end.getMonth(), 1);
  while(mc<=endM){
    months.push({y:mc.getFullYear(), m:mc.getMonth(), label:MONTHS[mc.getMonth()].slice(0,3)+' '+String(mc.getFullYear()).slice(2)});
    mc = new Date(mc.getFullYear(), mc.getMonth()+1, 1);
  }
  const monthAverages = months.map(mo=>{
    const scores = activeHabits.map(h=>habitScoreForMonth(h, mo.y, mo.m)).filter(v=>v!==null);
    return scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
  });

  let html = `<div class="grid cols-4" style="margin-bottom:24px;">
    <div class="stat"><div class="label">Период наблюдения</div><div class="value" style="font-size:16px;">${fmtDate(toISO(start))}</div><div class="sub">по сегодня, ${months.length} мес.</div></div>
    <div class="stat"><div class="label">Средняя эффективность</div><div class="value">${overallAvg}%</div><div class="sub">среднее по привычкам, с учётом нормы</div></div>
    <div class="stat"><div class="label">Активных привычек</div><div class="value">${activeHabits.length}</div><div class="sub">из ${state.habits.length} созданных</div></div>
    <div class="stat"><div class="label">Лучшая серия</div><div class="value">${bestStreakOverall}</div><div class="sub">выполненных сессий подряд, максимум</div></div>
  </div>`;

  html += `<div class="chart-box" style="margin-bottom:24px;"><h4>Динамика эффективности по месяцам</h4><canvas id="allTimeChart" height="90"></canvas></div>`;

  html += `<div class="card"><table><thead><tr><th>Привычка</th><th>Категория</th><th>Норма</th><th>Средний результат</th><th>Лучшая серия</th></tr></thead><tbody>`;
  perHabit.sort((a,b)=>(b.avg||0)-(a.avg||0)).forEach(p=>{
    const cat = state.categories.find(c=>c.id===p.h.categoryId);
    const norm = p.h.cadence==='daily' ? 'Ежедневно' : p.h.cadence==='weekly' ? p.h.freq+'×/неделю' : p.h.freq+'×/месяц';
    html += `<tr><td><strong>${p.h.name}</strong></td><td><span class="tag" style="border-color:${cat?cat.color:'#ccc'};color:${cat?cat.color:'#666'};">${cat?cat.name:'—'}</span></td><td class="mono" style="font-size:11.5px;">${norm}</td><td class="mono">${p.avg===null?'—':p.avg+'%'}</td><td class="mono">${p.bestStreak}</td></tr>`;
  });
  html += `</tbody></table></div>`;

  c.innerHTML = html;
  drawLineChart('allTimeChart', months.map(m=>m.label), monthAverages.map(v=>v===null?0:v));
}

        <div class="habit-controls">
          <button class="btn btn-sm" onclick="openHabitModal('${h.id}')">Изменить</button>

function assignedDatesLabel(h){
  const now = new Date();
  const arr = h.cadence==='weekly' ? getWeeklyAssignment(h, weekKeyOf(now)) : getMonthlyAssignment(h, monthKeyOf(now));
  if(!arr || !arr.length) return 'дни не назначены';
  return arr.slice().sort().map(iso=>{
    const d = parseISO(iso);
    return h.cadence==='weekly' ? DOW[(d.getDay()+6)%7]+' '+d.getDate() : String(d.getDate());
  }).join(', ');
}

function toggleHabitActive(id){ const h=state.habits.find(x=>x.id===id); h.active=!h.active; saveState(); render(); }
function deleteCategory(id){
  const cat = state.categories.find(c=>c.id===id);
  const affected = state.habits.filter(h=>h.categoryId===id);
  const msg = affected.length
    ? `Удалить категорию «${cat.name}»? Вместе с ней будут удалены привычки этой категории (${affected.length}) и вся история отметок по ним. Это необратимо.`
    : `Удалить категорию «${cat.name}»?`;
  if(!confirm(msg)) return;
  const affectedIds = affected.map(h=>h.id);
  state.habits = state.habits.filter(h=>h.categoryId!==id);
  Object.keys(state.entries).forEach(k=>{ if(affectedIds.includes(k.split('|')[0])) delete state.entries[k]; });
  affectedIds.forEach(hid=>{
    Object.keys(state.weeklyAssignments).forEach(k=>{ if(k.startsWith(hid+'|')) delete state.weeklyAssignments[k]; });
    Object.keys(state.monthlyAssignments).forEach(k=>{ if(k.startsWith(hid+'|')) delete state.monthlyAssignments[k]; });
  });
  state.strategicPlan = state.strategicPlan.filter(p=>!affectedIds.includes(p.habitId));
  state.categories = state.categories.filter(c=>c.id!==id);
  saveState(); toast('Категория и её привычки удалены'); render();
}

/* -------- модалка: привычка -------- */
function openHabitModal(id){

  // радиокнопкам/чипам должны только перерисовывать окно из этого черновика,
  // а не пересоздавать его заново — иначе выбор сбрасывается.
  const editing = id ? state.habits.find(h=>h.id===id) : null;
  const draft = editing ? JSON.parse(JSON.stringify(editing)) : {id:null, name:'', description:'', categoryId:state.categories[0]?.id||'', trackingType:'binary', target:100, unit:'', stepSize:1, cadence:'daily', freq:2, segments:[], active:true};

}

  const unitEl = document.getElementById('f_unit');
  if(unitEl) draft.unit = unitEl.value;
  const freqEl = document.getElementById('f_freq');
  if(freqEl) draft.freq = Number(freqEl.value)||draft.freq;

    <div class="modal-head"><h3>${editingId?'Изменить привычку':'Новая привычка'}</h3><button class="close-x" onclick="closeModal()">✕</button></div>

          ${draft.segments.filter(s=>!['Утро','День','Вечер'].includes(s)).map(s=>`<div class="chip sel" onclick="toggleSeg('${s}')">${s}</div>`).join('')}

function setDraftField(k,v){
  window.__habitDraft[k]=v;
  renderHabitModal();
}
function toggleSeg(s){
  const d=window.__habitDraft; const i=d.segments.indexOf(s);
  if(i>-1) d.segments.splice(i,1); else d.segments.push(s);
  renderHabitModal();
}
function addCustomSeg(){
  const name = prompt('Название части дня:');
  if(!name) return;
  window.__habitDraft.segments.push(name);
  renderHabitModal();
}
function upsertTargetHistory(history, newTarget, effectiveDate){
  const hist = (history && history.length) ? history.slice() : [];
  if(!hist.length){ hist.push({date:effectiveDate, target:newTarget}); return hist; }
  const last = hist[hist.length-1];
  if(last.date===effectiveDate){ last.target = newTarget; }
  else if(last.target!==newTarget){ hist.push({date:effectiveDate, target:newTarget}); }
  return hist;
}
function saveHabitDraft(){
  const d = window.__habitDraft;
  const existing = d.id ? state.habits.find(h=>h.id===d.id) : null;
  d.name = document.getElementById('f_name').value.trim();
  if(!d.name){ toast('Введите название привычки'); return; }
  d.description = document.getElementById('f_desc').value.trim();
  d.categoryId = document.getElementById('f_cat').value;
  if(d.trackingType==='percentage'){
    d.target = Number(document.getElementById('f_target').value)||100;
    d.unit = document.getElementById('f_unit').value.trim();
    d.stepSize = Number(document.getElementById('f_step').value)||1;
    // Меняем цель — сохраняем прежние значения в истории, чтобы прошлые дни
    // по-прежнему считались по цели, которая тогда действовала.
    const effectiveDate = d.id ? todayISO() : (d.createdAt || todayISO());
    d.targetHistory = upsertTargetHistory(existing ? existing.targetHistory : null, d.target, effectiveDate);
  }
  if(d.cadence!=='daily'){ d.freq = Number(document.getElementById('f_freq').value)||1; d.segments=[]; }
  if(d.id){
    const idx = state.habits.findIndex(h=>h.id===d.id); state.habits[idx]=d;
  } else {
    d.id = uid('h'); d.active=true; d.createdAt=todayISO(); state.habits.push(d);
  }
  saveState(); closeModal(); toast('Привычка сохранена — появится во всех отчётах'); render();
}
function deleteHabit(id){
  const h = state.habits.find(x=>x.id===id);
  if(!confirm(`Удалить привычку «${h?h.name:''}» и всю историю по ней? Это необратимо.`)) return;
  state.habits = state.habits.filter(x=>x.id!==id);
  Object.keys(state.entries).forEach(k=>{ if(k.startsWith(id+'|')) delete state.entries[k]; });
  Object.keys(state.weeklyAssignments).forEach(k=>{ if(k.startsWith(id+'|')) delete state.weeklyAssignments[k]; });
  Object.keys(state.monthlyAssignments).forEach(k=>{ if(k.startsWith(id+'|')) delete state.monthlyAssignments[k]; });
  state.strategicPlan = state.strategicPlan.filter(p=>p.habitId!==id);
  saveState(); closeModal(); toast('Привычка удалена'); render();
}

function isPastDate(iso){
  const d = parseISO(iso);
  const t = new Date(); t.setHours(0,0,0,0);
  return d < t;
}

/* -------- модалка: перенос дней (weekly/monthly) в рамках текущего периода -------- */
function openRescheduleModal(habitId){
  const h = state.habits.find(x=>x.id===habitId);
  if(!h || h.cadence==='daily'){ toast('Перенос доступен только для привычек с гибким графиком'); return; }
  const now = new Date();
  const isWeekly = h.cadence==='weekly';
  const periodKey = isWeekly ? weekKeyOf(now) : monthKeyOf(now);
  const current = isWeekly ? getWeeklyAssignment(h, periodKey) : getMonthlyAssignment(h, periodKey);
  if(!current){ toast('Сначала назначьте дни на текущий период — нажмите «Назначить дни»'); openAssignModal(); return; }
  window.__reschedule = {habitId, periodKey, isWeekly, picks:current.slice()};
  renderRescheduleModal();
  openModal();
}
function renderRescheduleModal(){
  const rs = window.__reschedule;
  const h = state.habits.find(x=>x.id===rs.habitId);
  const now = new Date();
  let allDates = [];
  if(rs.isWeekly){
    const ws = startOfWeek(now);
    allDates = [0,1,2,3,4,5,6].map(idx=>{ const dt=addDays(ws,idx); return {iso:toISO(dt), label:DOW[idx]+' '+dt.getDate()}; });
  } else {
    const y=now.getFullYear(), m=now.getMonth(), nd=daysInMonth(y,m);
    allDates = Array.from({length:nd},(_,k)=>k+1).map(dnum=>{ const dt=new Date(y,m,dnum); return {iso:toISO(dt), label:String(dnum)}; });
  }
  const futureCount = allDates.filter(d=>!isPastDate(d.iso)).length;
  const optionsHTML = `<div class="check-row">` + allDates.map(d=>{
    const sel = rs.picks.includes(d.iso);
    const past = isPastDate(d.iso);
    if(past && sel) return `<div class="chip missed" onclick="toggleReschedulePick('${d.iso}')" title="Прошедший день — нажмите, чтобы снять и освободить">${d.label} ✕</div>`;
    if(past && !sel) return `<div class="chip disabled" title="Прошедший день недоступен для назначения">${d.label}</div>`;
    return `<div class="chip ${sel?'sel':''}" onclick="toggleReschedulePick('${d.iso}')">${d.label}</div>`;
  }).join('') + `</div>`;

  const notice = h.freq > futureCount + rs.picks.filter(iso=>isPastDate(iso)).length
    ? `<div class="banner" style="margin-top:12px;"><div><strong>Недостаточно дней в периоде</strong><p>Осталось ${futureCount} дн. до конца периода — выполнить норму в ${h.freq} раз(а) полностью уже не получится, можно распределить, сколько успеете.</p></div></div>`
    : '';

  const box = document.getElementById('modalBox');
  box.innerHTML = `<div class="modal-head"><h3>Перенос дней — ${h.name}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p style="font-size:12.5px;color:var(--muted);margin-top:0;">Изменения действуют только в рамках текущего${rs.isWeekly?' недели':' месяца'}. Норма — <strong>${h.freq}</strong> ${rs.isWeekly?'дн.':'дат'}. Нажмите на прошедший назначенный день (со значком ✕), чтобы снять его, и выберите вместо него сегодняшний или будущий день.</p>
      ${optionsHTML}
      <div class="hint">Выбрано: ${rs.picks.length} из ${h.freq}</div>
      ${notice}
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="saveReschedule()">Сохранить перенос</button></div>`;
}
function toggleReschedulePick(iso){
  const rs = window.__reschedule; const h = state.habits.find(x=>x.id===rs.habitId);
  const idx = rs.picks.indexOf(iso);
  if(idx>-1){
    // снимаем — разрешено как для будущих, так и для прошедших (уже назначенных) дней
    rs.picks.splice(idx,1);
  } else {
    if(isPastDate(iso)){ toast('Нельзя назначить прошедший день'); return; }
    if(rs.picks.length>=h.freq){ toast('Уже выбрано максимум: '+h.freq); return; }
    rs.picks.push(iso);
  }
  renderRescheduleModal();
}
function saveReschedule(){
  const rs = window.__reschedule; const h = state.habits.find(x=>x.id===rs.habitId);
  if(rs.picks.length===0){ toast('Выберите хотя бы один день'); return; }
  if(rs.picks.length>h.freq){ toast('Выбрано больше, чем нужно: максимум '+h.freq); return; }
  if(rs.isWeekly) setWeeklyAssignment(h, rs.periodKey, rs.picks);
  else setMonthlyAssignment(h, rs.periodKey, rs.picks);
  closeModal();
  toast(rs.picks.length<h.freq ? 'Дни перенесены (выполнено будет меньше нормы — не хватило дней в периоде)' : 'Дни перенесены');
  render();
}

    <div class="modal-body">
      <div class="field"><label>Название</label><input type="text" id="f_catName" value="${editing?editing.name:''}" placeholder="Например, «Финансы»"></div>
      <div class="field"><label>Цвет</label><div class="check-row">${CAT_COLORS.map(col=>`<div onclick="selectCatColor('${col}')" class="color-opt" data-color="${col}" style="width:26px;height:26px;border-radius:6px;background:${col};cursor:pointer;outline:${window.__catColor===col?'2px solid #333':'none'};"></div>`).join('')}</div></div>
    </div>

      <button class="btn btn-primary" onclick="saveCategoryDraft()">${editing?'Сохранить':'Создать'}</button>

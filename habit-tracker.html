function selectCatColor(col){
  window.__catColor = col;
  document.querySelectorAll('.color-opt').forEach(e=>{ e.style.outline = e.getAttribute('data-color')===col ? '2px solid #333' : 'none'; });
}
function saveCategoryDraft(){
  const name = document.getElementById('f_catName').value.trim();
  if(!name){ toast('Введите название категории'); return; }
  if(window.__catDraftId){
    const cat = state.categories.find(c=>c.id===window.__catDraftId);
    cat.name = name; cat.color = window.__catColor || cat.color;
    saveState(); closeModal(); toast('Категория обновлена'); render();
  } else {
    state.categories.push({id:uid('cat'), name, color:window.__catColor||CAT_COLORS[0]});
    saveState(); closeModal(); toast('Категория добавлена'); render();
  }
}

/* -------- модалка: назначение дней недели/месяца -------- */
function openAssignModal(){
  const d = new Date();
  const wk = weekKeyOf(weekCursor.getTime?weekCursor:d);
  const needing = habitsNeedingAssignment(currentView==='month'?monthCursor:(currentView==='week'?weekCursor:d));
  if(!needing.length){ closeModal(); return; }
  window.__assignQueue = needing;
  window.__assignIdx = 0;
  window.__assignPicks = {};
  renderAssignStep();
  openModal();
}
function renderAssignStep(){
  const q = window.__assignQueue, i = window.__assignIdx;
  const box = document.getElementById('modalBox');
  if(i>=q.length){
    box.innerHTML = `<div class="modal-head"><h3>Готово</h3></div><div class="modal-body"><p>Дни назначены для всех привычек.</p></div><div class="modal-foot"><button class="btn btn-primary" onclick="closeModal();render();">Закрыть</button></div>`;
    return;
  }
  const h = q[i];
  const refDate = currentView==='month' ? monthCursor : (currentView==='week' ? weekCursor : new Date());
  let optionsHTML='';
  if(h.cadence==='weekly'){
    const ws = startOfWeek(refDate);
    optionsHTML = `<div class="check-row">` + [0,1,2,3,4,5,6].map(idx=>{
      const dt = addDays(ws,idx); const iso=toISO(dt);
      const sel = (window.__assignPicks[h.id]||[]).includes(iso);
      const past = isPastDate(iso);
      const cls = sel ? 'sel' : (past?'disabled':'');
      return `<div class="chip ${cls}" ${past?'':`onclick="toggleAssignPick('${h.id}','${iso}')"`}>${DOW[idx]} ${dt.getDate()}</div>`;
    }).join('') + `</div><div class="hint">Выберите ${h.freq} дн. Прошедшие дни этой недели недоступны. Позже можно перенести день в рамках этой недели.</div>`;
  } else {
    const y=refDate.getFullYear(), m=refDate.getMonth(), nd=daysInMonth(y,m);
    optionsHTML = `<div class="check-row" style="max-height:180px;overflow:auto;">` + Array.from({length:nd},(_,k)=>k+1).map(dnum=>{
      const dt=new Date(y,m,dnum); const iso=toISO(dt);
      const sel = (window.__assignPicks[h.id]||[]).includes(iso);
      const past = isPastDate(iso);
      const cls = sel ? 'sel' : (past?'disabled':'');
      return `<div class="chip ${cls}" ${past?'':`onclick="toggleAssignPick('${h.id}','${iso}')"`}>${dnum}</div>`;
    }).join('') + `</div><div class="hint">Выберите ${h.freq} дат. Прошедшие даты этого месяца недоступны. Позже можно перенести дату в рамках этого месяца.</div>`;
  }
  box.innerHTML = `<div class="modal-head"><h3>${h.name} — выбор дней (${i+1}/${q.length})</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p style="font-size:12.5px;color:var(--muted);margin-top:0;">Нужно выбрать: <strong>${h.freq}</strong> ${h.cadence==='weekly'?'дн. на эту неделю':'дат на этот месяц'}.</p>
      ${optionsHTML}
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Позже</button><button class="btn btn-primary" onclick="confirmAssignStep()">Подтвердить и далее</button></div>`;
}
function toggleAssignPick(habitId, iso){
  if(isPastDate(iso)){ toast('Нельзя выбрать прошедший день'); return; }
  const h = window.__assignQueue.find(x=>x.id===habitId);
  const arr = window.__assignPicks[habitId] || [];
  const idx = arr.indexOf(iso);
  if(idx>-1) arr.splice(idx,1);
  else { if(arr.length>=h.freq){ toast('Достаточно выбрано: '+h.freq); } else arr.push(iso); }
  window.__assignPicks[habitId]=arr;
  renderAssignStep();
}
function confirmAssignStep(){
  const h = window.__assignQueue[window.__assignIdx];
  const picks = window.__assignPicks[h.id] || [];
  if(!picks.length){ toast('Выберите хотя бы один день'); return; }
  const refDate = currentView==='month' ? monthCursor : (currentView==='week' ? weekCursor : new Date());
  if(h.cadence==='weekly') setWeeklyAssignment(h, weekKeyOf(refDate), picks);
  else setMonthlyAssignment(h, monthKeyOf(refDate), picks);
  window.__assignIdx++;
  renderAssignStep();
}

/* =========================================================
   ВИД: СТРАТЕГИЧЕСКИЙ ПЛАН
   ========================================================= */
function renderStrategy(){
  setTop('Стратегия','Стратегический план внедрения привычек','Цепочка этапов по каждой привычке и визуализация сроков',
    `<button class="btn btn-primary" onclick="openPlanModal()">+ План по привычке</button>`);
  const c = document.getElementById('content');
  let html='';

  if(!state.strategicPlan.length){
    c.innerHTML = emptyState('Стратегический план пуст','Добавьте план внедрения для одной из привычек.','strategy');
    return;
  }

  // Диапазон дат для оси Ганта
  let minD=null, maxD=null;
  state.strategicPlan.forEach(p=> p.phases.forEach(ph=>{
    const s=parseISO(ph.start), e=parseISO(ph.end);
    if(!minD||s<minD) minD=s; if(!maxD||e>maxD) maxD=e;
  }));
  if(!minD){ minD=new Date(); maxD=addDays(new Date(),30); }
  const totalDays = Math.max(1,(maxD-minD)/86400000);

  html += `<div class="section-title"><h2>Диаграмма Ганта — сроки внедрения</h2><span class="hint">${fmtShort(minD)} — ${fmtShort(maxD)}</span></div>`;
  html += `<div class="gantt-wrap"><div class="gantt">`;
  html += `<div class="gantt-axis"><div></div><div class="gantt-axis-track">${ganttAxisLabels(minD,maxD)}</div></div>`;
  state.strategicPlan.forEach(p=>{
    const h = state.habits.find(x=>x.id===p.habitId);
    html += `<div class="gantt-row"><div class="gantt-label">${h?h.name:'—'}</div><div class="gantt-track">`;
    p.phases.forEach((ph,idx)=>{
      const s=parseISO(ph.start), e=parseISO(ph.end);
      const left = ((s-minD)/86400000)/totalDays*100;
      const width = Math.max(2,((e-s)/86400000)/totalDays*100);
      const color = CAT_COLORS[idx % CAT_COLORS.length];
      html += `<div class="gantt-bar" style="left:${left}%;width:${width}%;background:${color};" title="${ph.name}: ${fmtShort(s)} — ${fmtShort(e)}">${ph.name}</div>`;
    });
    html += `</div></div>`;
  });
  html += `</div></div>`;

  html += `<div class="section-title"><h2>Планы по привычкам</h2></div>`;
  state.strategicPlan.forEach(p=>{
    const h = state.habits.find(x=>x.id===p.habitId);
    html += `<div class="plan-card">
      <div class="plan-card-head">
        <div><h3 style="font-size:14.5px;">${h?h.name:'—'}</h3><p style="font-size:12px;color:var(--muted);margin:4px 0 0 0;max-width:640px;">${p.goal}</p></div>
        <div style="display:flex;gap:6px;flex-shrink:0;">
          <button class="btn btn-sm" onclick="openPlanModal('${p.id}')">Изменить</button>
          <button class="btn btn-sm btn-danger" onclick="deletePlan('${p.id}')">Удалить</button>
        </div>
      </div>`;
    p.phases.forEach((ph,idx)=>{
      html += `<div class="phase-item"><div class="phase-idx">${idx+1}</div><div class="phase-body">
        <div class="pname">${ph.name}</div>
        <div class="pdate">${fmtDate(ph.start)} → ${fmtDate(ph.end)}</div>
        ${ph.note?`<div class="pnote">${ph.note}</div>`:''}
      </div></div>`;
    });
    html += `</div>`;
  });

  c.innerHTML = html;
}
function ganttAxisLabels(minD,maxD){
  const n=6; let out='';
  for(let i=0;i<n;i++){ const d=new Date(minD.getTime()+(maxD-minD)*i/n); out+=`<div>${fmtShort(d)}</div>`; }
  return out;
}

function openPlanModal(id){
  const editing = id ? state.strategicPlan.find(p=>p.id===id) : null;
  const draft = editing ? JSON.parse(JSON.stringify(editing)) : {id:null, habitId:state.habits[0]?.id||'', goal:'', phases:[]};
  window.__planDraft = draft;
  renderPlanModal();
  openModal();
}
function renderPlanModal(){
  const d = window.__planDraft;
  const box = document.getElementById('modalBox');
  box.innerHTML = `<div class="modal-head"><h3>${d.id?'Изменить план':'Новый план внедрения'}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Привычка</label><select id="p_habit" onchange="window.__planDraft.habitId=this.value">${state.habits.map(h=>`<option value="${h.id}" ${h.id===d.habitId?'selected':''}>${h.name}</option>`).join('')}</select></div>
      <div class="field"><label>Критерий выполнения</label><textarea id="p_goal" placeholder="В каком случае привычка считается выполненной?">${d.goal}</textarea></div>
      <div class="field"><label>Этапы внедрения</label>
        <div id="phaseList">${d.phases.map((ph,idx)=>renderPhaseEditor(ph,idx)).join('')}</div>
        <button class="btn btn-sm" style="margin-top:6px;" onclick="addPhase()">+ Добавить этап</button>
      </div>
    </div>
    <div class="modal-foot">${d.id?`<button class="btn btn-danger" style="margin-right:auto;" onclick="deletePlan('${d.id}')">Удалить план</button>`:''}<button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="savePlanDraft()">Сохранить</button></div>`;
}
function renderPhaseEditor(ph,idx){
  return `<div style="border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;">
    <div style="display:flex;gap:8px;margin-bottom:6px;">
      <input type="text" style="flex:2;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;" placeholder="Название этапа" value="${ph.name}" onchange="updatePhase(${idx},'name',this.value)">
    </div>
    <div style="display:flex;gap:8px;margin-bottom:6px;">
      <input type="date" style="flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;" value="${ph.start}" onchange="updatePhase(${idx},'start',this.value)">
      <input type="date" style="flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;" value="${ph.end}" onchange="updatePhase(${idx},'end',this.value)">
      <button class="btn btn-sm btn-danger" onclick="removePhase(${idx})">✕</button>
    </div>
    <textarea style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;min-height:40px;" placeholder="Описание этапа" onchange="updatePhase(${idx},'note',this.value)">${ph.note||''}</textarea>
  </div>`;
}
function addPhase(){
  window.__planDraft.phases.push({id:uid('ph'), name:'Новый этап', start:todayISO(), end:toISO(addDays(new Date(),14)), note:''});
  renderPlanModal();
}
function updatePhase(idx,key,val){ window.__planDraft.phases[idx][key]=val; }
function removePhase(idx){ window.__planDraft.phases.splice(idx,1); renderPlanModal(); }
function savePlanDraft(){
  const d = window.__planDraft;
  d.habitId = document.getElementById('p_habit').value;
  d.goal = document.getElementById('p_goal').value.trim();
  if(!d.phases.length){ toast('Добавьте хотя бы один этап'); return; }
  if(d.id){ const idx=state.strategicPlan.findIndex(p=>p.id===d.id); state.strategicPlan[idx]=d; }
  else { d.id=uid('plan'); state.strategicPlan.push(d); }
  saveState(); closeModal(); toast('План сохранён'); render();
}
function deletePlan(id){
  if(!confirm('Удалить план?')) return;
  state.strategicPlan = state.strategicPlan.filter(p=>p.id!==id); saveState(); closeModal(); render();
}

function openModal(){ document.getElementById('overlay').classList.add('show'); }
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  // очищаем содержимое модалки, чтобы старые скрытые поля не "утекали"
  // в следующую открытую форму (например, из формы одной привычки в форму другой)
  document.getElementById('modalBox').innerHTML = '';
}
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

/* =========================================================
   ГРАФИКИ (Chart.js)
   ========================================================= */
let chartRefs = {};
function drawBarChart(canvasId, labels, data, colors){
  const ctx = document.getElementById(canvasId); if(!ctx) return;
  if(chartRefs[canvasId]) chartRefs[canvasId].destroy();
  chartRefs[canvasId] = new Chart(ctx, {
    type:'bar',
    data:{labels, datasets:[{data, backgroundColor:colors||'#1E7F72', borderRadius:5, maxBarThickness:38}]},
    options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'},grid:{color:'#EEF0F4'}}, x:{grid:{display:false}}}}
  });
}
function drawLineChart(canvasId, labels, data){
  const ctx = document.getElementById(canvasId); if(!ctx) return;
  if(chartRefs[canvasId]) chartRefs[canvasId].destroy();
  chartRefs[canvasId] = new Chart(ctx, {
    type:'line',
    data:{labels, datasets:[{data, borderColor:'#1E7F72', backgroundColor:'rgba(30,127,114,.12)', fill:true, tension:.3, pointBackgroundColor:'#1E7F72'}]},
    options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'},grid:{color:'#EEF0F4'}}, x:{grid:{display:false}}}}
  });
}

document.getElementById('btnExport').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'habit-tracker-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Резервная копия сохранена');
});
document.getElementById('btnImport').addEventListener('click', ()=> document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change', (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.habits||!data.categories){ toast('Файл не похож на резервную копию'); return; }
      state = data; saveState(); toast('Данные загружены'); render();
    }catch(err){ toast('Не удалось прочитать файл'); }
  };
  reader.readAsText(file);
  e.target.value='';
  closeModal();
});

document.getElementById('btnClear').addEventListener('click', openClearDataModal);
function openClearDataModal(){
  const box = document.getElementById('modalBox');
  box.innerHTML = `<div class="modal-head"><h3>Очистить данные</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p style="font-size:12.5px;color:var(--muted);margin-top:0;">Действие необратимо. Рекомендуем сначала сохранить копию (.json) слева внизу.</p>
      <div style="border:1px solid var(--border);border-radius:9px;padding:14px;margin-bottom:10px;">
        <strong style="font-size:13px;">Очистить только историю отметок</strong>
        <p style="font-size:12px;color:var(--muted);margin:5px 0 10px 0;">Привычки, категории и стратегический план останутся, все отметки за все дни будут удалены.</p>
        <button class="btn btn-danger btn-sm" onclick="performClear('entries')">Очистить историю</button>
      </div>
      <div style="border:1px solid var(--border);border-radius:9px;padding:14px;">
        <strong style="font-size:13px;">Полный сброс приложения</strong>
        <p style="font-size:12px;color:var(--muted);margin:5px 0 10px 0;">Удаляются вообще все данные: привычки, категории, история, стратегический план.</p>
        <button class="btn btn-danger btn-sm" onclick="performClear('all')">Сбросить всё</button>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Отмена</button></div>`;
  openModal();
}
function performClear(mode){
  const msg = mode==='all' ? 'Удалить абсолютно все данные приложения без возможности восстановления?' : 'Удалить всю историю отметок по всем привычкам без возможности восстановления?';
  if(!confirm(msg)) return;
  if(mode==='entries'){
    state.entries = {}; state.weeklyAssignments = {}; state.monthlyAssignments = {};
  } else {
    state = {categories:[], habits:[], entries:{}, weeklyAssignments:{}, monthlyAssignments:{}, strategicPlan:[]};
  }
  saveState(); closeModal(); toast('Данные очищены'); currentView='today'; render();
}

/* =========================================================
   ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ (Supabase)
   ========================================================= */
function getSyncConfig(){
  try{
    const raw = localStorage.getItem('habitops_sync_cfg');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function setSyncConfig(cfg){
  localStorage.setItem('habitops_sync_cfg', JSON.stringify(cfg));
}
function clearSyncConfig(){
  localStorage.removeItem('habitops_sync_cfg');
}
function setSyncStatus(text){
  const el = document.getElementById('syncState');
  if(el) el.textContent = text;
}
function genSyncId(){
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b=>b.toString(16).padStart(2,'0')).join('');
}

let cloudPushTimer = null;
function scheduleCloudPush(){
  const cfg = getSyncConfig();
  if(!cfg) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(pushToCloud, 1200);
}

async function pushToCloud(){
  const cfg = getSyncConfig();
  if(!cfg) return;
  setSyncStatus('Синхронизация…');
  try{
    const res = await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/habit_sync?on_conflict=sync_id', {
      method:'POST',
      headers:{
        'apikey': cfg.key,
        'Authorization': 'Bearer '+cfg.key,
        'Content-Type':'application/json',
        'Prefer':'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify([{sync_id:cfg.syncId, state:state, updated_at:new Date(state.updatedAt||Date.now()).toISOString()}])
    });
    setSyncStatus(res.ok ? 'В облаке · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) : 'Ошибка синхронизации ('+res.status+')');
  }catch(e){
    setSyncStatus('Нет сети — сохранено локально');
  }
}

async function pullFromCloud(cfg){
  try{
    const res = await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/habit_sync?sync_id=eq.'+encodeURIComponent(cfg.syncId)+'&select=state,updated_at', {
      headers:{ 'apikey':cfg.key, 'Authorization':'Bearer '+cfg.key }
    });
    if(!res.ok) return null;
    const rows = await res.json();
    return rows && rows[0] ? rows[0] : null;
  }catch(e){ return null; }
}

async function initSync(){
  const cfg = getSyncConfig();
  if(!cfg){ setSyncStatus('Синхронизация не настроена'); return; }
  setSyncStatus('Проверяем облако…');
  const remote = await pullFromCloud(cfg);
  const remoteTs = remote ? new Date(remote.updated_at).getTime() : 0;
  const localTs = state.updatedAt || 0;
  if(remote && remoteTs > localTs){
    state = remote.state;
    state.updatedAt = remoteTs;
    try{ localStorage.setItem('habitops_state_v1', JSON.stringify(state)); }catch(e){}
    toast('Загружены более свежие данные из облака');
    render();
    setSyncStatus('Синхронизировано · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
  } else {
    // Локальные данные не старше удалённых (или удалённых ещё нет вовсе) —
    // отправляем локальную версию в облако. Работает и при самой первой
    // настройке синхронизации, когда у локальных данных ещё нет метки времени.
    if(!state.updatedAt) state.updatedAt = Date.now();
    try{ localStorage.setItem('habitops_state_v1', JSON.stringify(state)); }catch(e){}
    pushToCloud();
  }
}

document.getElementById('btnSync').addEventListener('click', openSyncModal);
function openSyncModal(){
  const cfg = getSyncConfig() || {url:'', key:'', syncId: genSyncId()};
  const box = document.getElementById('modalBox');
  box.innerHTML = `<div class="modal-head"><h3>Синхронизация между устройствами</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p style="font-size:12.5px;color:var(--muted);margin-top:0;">
        Данные хранятся в вашей бесплатной базе на <a href="https://supabase.com" target="_blank" rel="noopener">Supabase</a>.
        Настройте один раз на компьютере, затем откройте эту же страницу на телефоне и введите те же данные — история подтянется автоматически.
      </p>
      <label style="font-size:12px;font-weight:600;display:block;margin:10px 0 4px;">Project URL</label>
      <input id="syncUrl" type="text" placeholder="https://xxxxx.supabase.co" value="${cfg.url||''}" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;">
      <label style="font-size:12px;font-weight:600;display:block;margin:10px 0 4px;">Anon public key</label>
      <input id="syncKey" type="text" placeholder="eyJhbGciOi..." value="${cfg.key||''}" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;">
      <label style="font-size:12px;font-weight:600;display:block;margin:10px 0 4px;">Sync ID (секретный, придумайте свой или сгенерируйте)</label>
      <div style="display:flex;gap:6px;">
        <input id="syncId" type="text" value="${cfg.syncId||''}" style="flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;">
        <button class="btn btn-sm" onclick="document.getElementById('syncId').value=genSyncId()">Сгенерировать</button>
      </div>
      <p style="font-size:11.5px;color:var(--muted);margin:8px 0 0;">Этот же Sync ID нужно ввести на телефоне — он как пароль к вашим данным. Никому не показывайте.</p>
    </div>
    <div class="modal-foot">
      ${cfg.url ? '<button class="btn btn-danger btn-sm" onclick="disconnectSync()">Отключить</button>' : '<span></span>'}
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveSyncConfig()">Сохранить и синхронизировать</button>
    </div>`;
  openModal();
}
function saveSyncConfig(){
  const url = document.getElementById('syncUrl').value.trim();
  const key = document.getElementById('syncKey').value.trim();
  const syncId = document.getElementById('syncId').value.trim();
  if(!url || !key || !syncId){ toast('Заполните все поля'); return; }
  setSyncConfig({url, key, syncId});
  closeModal();
  toast('Настройки сохранены, синхронизируем…');
  initSync();
}
function disconnectSync(){
  if(!confirm('Отключить синхронизацию на этом устройстве? Локальные данные останутся, облачные — нет.')) return;
  clearSyncConfig();
  setSyncStatus('Синхронизация не настроена');
  closeModal();
  toast('Синхронизация отключена');
}

/* PWA: регистрируем service worker, если он доступен на хостинге */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* нет sw.js рядом — не критично */ });
  });
}

/* =========================================================
   СТАРТ
   ========================================================= */
loadState();
render();
initSync();
</script>

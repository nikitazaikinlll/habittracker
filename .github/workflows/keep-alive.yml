name: Keep Supabase Alive

# Раз в несколько дней делает один лёгкий запрос к базе Supabase,
# чтобы бесплатный проект не уходил в автопаузу из-за отсутствия активности.
# Если запрос не прошёл (проект на паузе, неверный ключ), запуск станет красным,
# и GitHub пришлёт письмо.

on:
  schedule:
    - cron: '0 6 */3 * *'   # каждые 3 дня в 06:00 UTC
  workflow_dispatch: {}     # можно запустить вручную кнопкой Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail --silent --show-error --max-time 30 -o /dev/null -w "Ответ Supabase: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/habit_sync?select=sync_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
